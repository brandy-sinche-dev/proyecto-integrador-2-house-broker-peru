services:
  db:
    image: postgres:16-alpine
    container_name: housebroker-db
    environment:
      POSTGRES_DB: housebroker
      POSTGRES_USER: housebroker
      POSTGRES_PASSWORD: housebroker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housebroker -d housebroker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: