openapi: 3.0.3
info:
  title: HouseBroker Perú - API de Propiedades
  description: Contrato de API REST para la gestión de propiedades (Sprint 1 - APF1).
  version: 1.0.0

tags:
  - name: Propiedades
    description: Endpoints para la gestión administrativa y consulta de inmuebles

paths:
  /api/v1/properties:
    get:
      tags:
        - Propiedades
      summary: Obtener listado de propiedades
      responses:
        '200':
          description: Lista de propiedades obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
        '500':
          description: Error interno del servidor

    post:
      tags:
        - Propiedades
      summary: Registrar una nueva propiedad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '201':
          description: Propiedad creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          description: Datos de entrada inválidos o faltantes

  /api/v1/properties/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Propiedades
      summary: Obtener detalle de una propiedad
      responses:
        '200':
          description: Detalle de la propiedad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Propiedad no encontrada

    put:
      tags:
        - Propiedades
      summary: Actualizar una propiedad existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '200':
          description: Propiedad actualizada exitosamente
        '400':
          description: Datos de actualización inválidos
        '404':
          description: Propiedad no encontrada

    delete:
      tags:
        - Propiedades
      summary: Eliminación lógica de una propiedad
      responses:
        '200':
          description: Propiedad desactivada exitosamente
        '404':
          description: Propiedad no encontrada

components:
  schemas:
    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        title:
          type: string
          example: "Departamento amoblado en Miraflores"
        price:
          type: number
          format: float
          example: 150000.00
        address:
          type: string
          example: "Av. Larco 456, Miraflores"
        property_type:
          type: string
          enum: [DEPARTAMENTO, CASA, TERRENO, OFICINA]
          example: "DEPARTAMENTO"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-09-07T10:00:00Z"

    PropertyInput:
      type: object
      required:
        - title
        - price
        - address
        - property_type
      properties:
        title:
          type: string
        price:
          type: number
        address:
          type: string
        property_type:
          type: string
          enum: [DEPARTAMENTO, CASA, TERRENO, OFICINA]