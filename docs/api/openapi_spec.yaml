  /api/v1/properties:
    get:
      tags:
        - Propiedades
      operationId: listProperties
      summary: Obtener listado paginado de propiedades
      description: |
        Devuelve el catálogo de propiedades en formato paginado.

        Solo se incluyen propiedades activas (`is_active = true`). El orden por
        defecto es `created_at` descendente (más recientes primero).

        ### Búsqueda y filtros (HU-PROP-03)

        Los filtros se aplican sobre el mismo recurso del catálogo, como *query
        parameters* opcionales. Los filtros presentes se combinan entre sí con
        conjunción lógica (AND) y con `is_active = true`:

        | Filtro | Campo |
        |---|---|
        | `minPrice` / `maxPrice` | `price`, inclusivo en ambos extremos |
        | `propertyType` | `property_type` |
        | `ubigeo` | `ubigeo` del distrito (código INEI de 6 dígitos) |
        | `search` | `title` y `address` |

