      summary: Listar las propiedades guardadas
      description: |
        Devuelve los inmuebles que el usuario autenticado ha guardado, del más
        reciente al más antiguo.

        Es una lista **por usuario**: el backend la filtra por el `sub` del access
        token, así que dos personas nunca ven los favoritos de la otra. El
        endpoint no acepta ningún parámetro de usuario, y no debe añadirse uno:
        si lo admitiera, bastaría cambiar `?user_id=` para leer los favoritos
        ajenos.

        ### Orden y paginación

        Se ordena por `added_at` descendente, que es lo que espera la vista "Mis
        Favoritos": lo guardado después aparece primero. Es un orden estable
        porque cada favorito tiene su propia fecha, a diferencia del
        `created_at` de un inmueble, que puede empatar entre varios.

        Los parámetros `page` y `limit` se comportan como en el catálogo, con
        `DEFAULT_PAGE` y `DEFAULT_LIMIT` cuando se omiten.
      responses:
