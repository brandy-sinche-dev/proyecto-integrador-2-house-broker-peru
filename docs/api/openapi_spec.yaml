  /api/v1/appointments:
    get:
      tags:
        - Citas
      operationId: listAppointments
      summary: Obtener listado paginado de citas
      description: |
        Devuelve la agenda de citas del usuario autenticado en formato paginado
        (RF-CRM-02).

        ### Alcance según el rol

        El conjunto de citas visibles depende del rol del token, y el parámetro
        `role` selecciona explícitamente una de esas perspectiva:

        | `role` | Citas devueltas |
        |---|---|
        | `CLIENTE` | Citas en las que el usuario actúa como cliente |
        | `AGENTE` | Citas en las que el usuario es el agente asignado |
        | `ADMINISTRADOR` | Todas las citas de la plataforma |

        Si se omite `role`, se aplica el rol del usuario autenticado. Un
        `CLIENTE` y un `AGENTE` no pueden consultar la perspectiva de otro: el
        `403` se produce cuando el recurso existe pero el token no lo autoriza.

        ### Filtros

        Todos los filtros son opcionales, se combinan entre sí con conjunción
        (AND) y un parámetro enviado con valor vacío equivale a omitirlo. La
        validación no corta en el primer fallo: `errors` contiene una entrada
        por cada parámetro inválido de la misma petición.

        | Filtro | Tipo | Campo | Semántica |
        |---|---|---|---|
        | `status` | array de `AppointmentStatus` | `status` | OR entre valores repetidos |
        | `role` | `UserRole` | perspectiva del usuario | — |
        | `dateFrom` | date | `scheduled_at` | extremo **inclusivo** |
        | `dateTo` | date | `scheduled_at` | extremo **inclusivo** |

        `dateFrom` y `dateTo` acotan la **fecha de la visita** (`scheduled_at`),
        no la fecha de creación del registro, y se interpretan en
        `America/Lima`. Si se envía `dateTo` sin `dateFrom`, el rango se abre
        hacia el pasado sin límite; si se envía `dateFrom` sin `dateTo`, hacia
        el futuro. Un rango invertido produce `400` con `invalid_filter_range`.

        El orden por defecto es `scheduled_at` ascendente: la agenda del agente
        empieza por lo próximo. `count` y el header `X-Total-Count` reflejan el
        total **después** de aplicar los filtros.

        Si la página solicitada queda fuera de rango, la respuesta es `200` con
        `results` vacío y `next` en `null`; no es un error.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/XRequestIdParam'
        - $ref: '#/components/parameters/AppointmentStatusFilter'
        - $ref: '#/components/parameters/AppointmentRoleFilter'
        - $ref: '#/components/parameters/AppointmentDateFrom'
        - $ref: '#/components/parameters/AppointmentDateTo'
      responses:
        '200':
          description: Listado de citas obtenido exitosamente
          headers:
            X-Total-Count:
              description: Total de citas que cumplen los filtros, sin paginar.
              schema:
                type: integer
                format: int32
              example: 12
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointments'
              example:
                count: 12
                next: http://localhost:8000/api/v1/appointments?limit=3&page=2
                previous: null
                results:
                  - id: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                    status: CONFIRMED
                    scheduled_at: '2026-10-08T15:00:00Z'
                    duration_minutes: 45
                    property:
                      id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                      title: Departamento amoblado en Miraflores
                      district: Miraflores
                      address: Av. Larco 456, Miraflores
                    client:
                      id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
                      full_name: Maria Fernanda Quispe
                    agent:
                      id: 7c4a9d21-3b6e-4f80-9a2d-5e7c1b3f8d40
                      full_name: Brandy Sinche
                    created_at: '2026-10-05T09:12:44Z'
                    updated_at: '2026-10-06T14:03:21Z'
        '400':
          description: Parámetros de consulta o de paginación inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                estadoInvalido:
                  summary: '`status` fuera del enum'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El parámetro 'status' admite los valores PENDING, CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED, NO_SHOW.
                    instance: /api/v1/appointments?status=AGENDADA
                    code: invalid_query_parameter
                    errors:
                      - parameter: status
                        message: El valor 'AGENDADA' no pertenece al conjunto permitido (PENDING, CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED, NO_SHOW).
                rangoInvertido:
                  summary: Rango de fechas incoherente
                  value:
                    type: https://housebroker.pe/errors/invalid-filter-range
                    title: Rango de fechas inválido
                    status: 400
                    detail: El parámetro 'dateTo' no puede ser anterior a 'dateFrom'.
                    instance: /api/v1/appointments?dateFrom=2026-10-31&dateTo=2026-10-01
                    code: invalid_filter_range
                    errors:
                      - parameter: dateTo
                        message: El valor '2026-10-01' es anterior a 'dateFrom' (2026-10-31).
                fechaMalformada:
                  summary: 'Formato de fecha inválido'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El parámetro 'dateFrom' debe tener formato ISO 8601 (YYYY-MM-DD).
                    instance: /api/v1/appointments?dateFrom=08-10-2026
                    code: invalid_query_parameter
                    errors:
                      - parameter: dateFrom
                        message: El valor '08-10-2026' no cumple el formato YYYY-MM-DD.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El token es válido pero no puede consultar la perspectiva solicitada:
            un `CLIENTE` o un `AGENTE` que pide `role=ADMINISTRADOR`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              example:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: El rol AGENTE solo puede consultar las citas que tiene asignadas.
                instance: /api/v1/appointments?role=ADMINISTRADOR
                code: forbidden
                required_roles:
                  - ADMINISTRADOR
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Citas
      operationId: createAppointment
      summary: Solicitar la reserva de una visita
      description: |
        Crea una solicitud de visita a un inmueble (RF-CRM-01). La cita nace
        siempre en estado `PENDING`: reservarla no la confirma. La confirmación
        es una acción posterior del agente, en
        `PATCH /api/v1/appointments/{id}/status`.

        ### De dónde sale el horario

        `scheduled_at` debe coincidir **exactamente** con un `start_at` devuelto
        por `GET /api/v1/properties/{id}/available-slots?date=...`. El servidor
        no ajusta ni redondea la hora: si no hay coincidencia exacta devuelve
        `400`, porque las franjas que no atienden la visita no se agendan.

        La comprobación se repite dentro de la misma transacción que inserta la
        cita, de modo que dos reservas simultáneas por el mismo horario no
        puedan aceptarse ambas. Si el horario se tomó entre la consulta de
        disponibilidad y este `POST`, la respuesta es `409` con
        `appointment_slot_conflict` y **no** se crea ninguna cita.

        ### Quién agenda y para quién

        Un `CLIENTE` agenda para sí mismo: su identificador se toma del token y
        **no se acepta en el cuerpo**, para que nadie pueda registrar una cita
        en nombre de otro. Un `AGENTE` o un `ADMINISTRADOR` puede registrar una
        visita en nombre de un cliente mediante `client_id`.

        ### Efectos derivados

        El backend envía el correo de confirmación al cliente y la notificación
        al agente asignado (RF-SEC-05). Ese envío es posterior a la respuesta
        `201` y su fallo no revoca la cita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreateInput'
            examples:
              clienteAgenda:
                summary: Un cliente reserva para sí mismo
                value:
                  property_id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                  scheduled_at: '2026-10-08T16:00:00Z'
              agenteRegistra:
                summary: Un agente registra la visita de un cliente que llega a oficina
                value:
                  property_id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                  scheduled_at: '2026-10-08T16:00:00Z'
                  client_id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
      responses:
        '201':
          description: Visita solicitada exitosamente
          headers:
            Location:
              description: URL del recurso creado.
              schema:
                type: string
                format: uri
              example: http://localhost:8000/api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                status: PENDING
                scheduled_at: '2026-10-08T16:00:00Z'
                duration_minutes: 60
                reason: null
                property:
                  id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                  title: Departamento amoblado en Miraflores
                  district: Miraflores
                  address: Av. Larco 456, Miraflores
                client:
                  id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
                  full_name: Maria Fernanda Quispe
                  email: maria.quispe@correo.com
                  phone: '+51 987 654 321'
                agent:
                  id: 7c4a9d21-3b6e-4f80-9a2d-5e7c1b3f8d40
                  full_name: Brandy Sinche
                  email: brandy.sinche@housebrokerperu.com
                created_at: '2026-10-05T09:12:44Z'
                updated_at: '2026-10-05T09:12:44Z'
        '400':
          description: |
            El cuerpo o el horario no son válidos. Casos cubiertos:
            - `scheduled_at` con formato distinto de ISO 8601, o ausente.
            - `scheduled_at` en una fecha pasada o más de 60 días vista adelante.
            - El horario no coincide con ninguna franja habilitada de la
              propiedad.
            - La propiedad existe pero no admite agendamiento porque su
              `PropertyStatus` es `RESERVADO`, `ALQUILADO`, `VENDIDO` o
              `SUSPENDIDO`.
            - Falta `client_id` en una reserva registrada por un agente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                horarioInvalido:
                  summary: La hora no cae en ninguna franja de atención
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El horario '2026-10-08T16:00:00Z' no coincide con ninguna franja habilitada de la propiedad.
                    instance: /api/v1/appointments
                    code: invalid_query_parameter
                    errors:
                      - parameter: scheduled_at
                        message: Los horarios disponibles para el 2026-10-08 son 14:00 y 16:00.
                propiedadNoAgendable:
                  summary: El inmueble no admite visitas
                  value:
                    type: https://housebroker.pe/errors/property-not-bookable
                    title: Propiedad no agendable
                    status: 400
                    detail: La propiedad esta en estado 'RESERVADO' y no admite nuevas visitas.
                    instance: /api/v1/appointments
                    code: property_not_bookable
                    errors:
                      - parameter: property_id
                        message: Solo se pueden agendar visitas sobre propiedades en estado DISPONIBLE.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El token es válido pero el usuario no puede registrar la visita.
            Ocurre cuando la cuenta está desactivada (`is_active = false`) o
            cuando un `CLIENTE` intenta enviar `client_id` para agendar en
            nombre de otro.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              example:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: Un cliente no puede registrar citas en nombre de otro usuario.
                instance: /api/v1/appointments
                code: forbidden
        '404':
          description: |
            La propiedad indicada no existe, o el `client_id` enviado no
            corresponde a un usuario registrado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
              example:
                type: https://housebroker.pe/errors/resource-not-found
                title: Recurso no encontrado
                status: 404
                detail: No existe una propiedad con el identificador indicado.
                instance: /api/v1/appointments
                code: resource_not_found
        '409':
          description: |
            El horario ya está ocupado por otra cita en estado `PENDING`,
            `CONFIRMED` o `RESCHEDULED`. No se crea ninguna cita: la reserva es
            atómica, no parcial.

            Usa el mismo código que la reprogramación de
            `PATCH /api/v1/appointments/{id}/status`, porque es la misma
            condición de negocio: un horario tomado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemConflict'
              example:
                type: https://housebroker.pe/errors/appointment-slot-conflict
                title: Conflicto de horario de cita
                status: 409
                detail: El horario '2026-10-08T16:00:00Z' ya esta ocupado por la cita f1e2d3c4-5a6b-4c7d-8e9f-0a1b2c3d4e5f.
                instance: /api/v1/appointments
                code: appointment_slot_conflict
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/appointments/{id}/status:
    parameters:
      - $ref: '#/components/parameters/AppointmentId'

    patch:
      tags:
        - Citas
      operationId: updateAppointmentStatus
      summary: Actualizar el estado de una cita
      description: |
        Cambia el estado de una cita (RF-CRM-02). Es un `PATCH` semántico: el
        cuerpo puede contener `status`, `scheduled_at` o `reason`, y el resto de
        campos de la cita queda intacto.

        Cubre las acciones de **aceptar**, **rechazar** y **reprogramar** que
        describe RF-CRM-02, más el cierre de la visita y el registro de la
        inasistencia.

        | Estado | Significado |
        |---|---|
        | `PENDING` | Solicitud del cliente pendiente de confirmación del agente |
        | `CONFIRMED` | Visita aceptada por el agente |
        | `RESCHEDULED` | Visita movida a un nuevo horario, pendiente de reconfirmar |
        | `COMPLETED` | Visita realizada |
        | `CANCELLED` | Visita cancelada |
        | `NO_SHOW` | El cliente no asistió |

        Transiciones admitidas:

        | Estado actual | Se puede mover a |
        |---|---|
        | `PENDING` | `CONFIRMED`, `RESCHEDULED`, `CANCELLED` |
        | `CONFIRMED` | `RESCHEDULED`, `COMPLETED`, `NO_SHOW`, `CANCELLED` |
        | `RESCHEDULED` | `CONFIRMED`, `CANCELLED` |
        | `COMPLETED` | — (terminal) |
        | `CANCELLED` | — (terminal) |
        | `NO_SHOW` | — (terminal) |

        Cualquier transición no listada produce `400` con
        `invalid_appointment_transition`. Los tres estados terminales no admiten
        cambio: una visita ya realizada no puede cancelarse, que es la regla que
        `TASK-TEST-CRM-02` verifica en el backend.

        ### Reprogramación

        La reprogramación es una transición a `RESCHEDULED` y exige enviar
        `scheduled_at` con el nuevo horario. El campo es obligatorio en esa
        transición y está prohibido en las demás. El nuevo horario debe:

        - ser posterior al momento actual,
        - coincidir con una franja de `ScheduleSlot` habilitada de la propiedad
          (`GET /api/v1/properties/{id}/schedules` del Sprint 3), y
        - no solaparse con otra cita del mismo agente, lo que produce `409` con
          `appointment_slot_conflict`.

        Al reprogramar se conservan `client`, `agent` y `property`: la cita no
        cambia de participantes, solo de horario.

        ### Idempotencia y respuesta

        La operación es idempotente respecto al estado de destino: repetirla
        con el mismo `status` devuelve `200` sin efectos adicionales, no `409`.

        La respuesta devuelve `previous_status` y `previous_scheduled_at` para
        que el cliente pueda revertir su actualización optimista tras un fallo
        de red.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentStatusInput'
            examples:
              confirmar:
                summary: Aceptar una cita pendiente
                value:
                  status: CONFIRMED
              cancelar:
                summary: Rechazar una cita pendiente
                value:
                  status: CANCELLED
                  reason: El cliente solicito postergar la visita por viaje de trabajo.
              completar:
                summary: Registrar una visita realizada
                value:
                  status: COMPLETED
              inasistencia:
                summary: Registrar que el cliente no asistio
                value:
                  status: NO_SHOW
                  reason: El agente espero 15 minutos sin que el cliente llegue.
              reprogramar:
                summary: Mover la cita a un horario disponible
                value:
                  status: RESCHEDULED
                  scheduled_at: '2026-10-15T17:00:00Z'
                  reason: El propietario no se encuentra disponible en ese horario.
      responses:
        '200':
          description: Estado de la cita actualizado exitosamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentStatusResult'
              example:
                id: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                status: RESCHEDULED
                previous_status: CONFIRMED
                scheduled_at: '2026-10-15T17:00:00Z'
                previous_scheduled_at: '2026-10-08T15:00:00Z'
                reason: El propietario no se encuentra disponible en ese horario.
                changed_by: 7c4a9d21-3b6e-4f80-9a2d-5e7c1b3f8d40
                changed_at: '2026-10-07T11:40:00Z'
        '400':
          description: Cuerpo inválido o transición de estado no permitida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                transicionInvalida:
                  summary: Transición desde un estado terminal
                  value:
                    type: https://housebroker.pe/errors/invalid-appointment-transition
                    title: Transición de estado de cita no permitida
                    status: 400
                    detail: No se puede pasar de 'COMPLETED' a 'CANCELLED'. COMPLETED, CANCELLED y NO_SHOW son estados terminales.
                    instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                    code: invalid_appointment_transition
                    errors:
                      - parameter: status
                        message: La transición COMPLETED -> CANCELLED no está permitida.
                estadoInvalido:
                  summary: '`status` fuera del enum'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El campo 'status' admite los valores CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED y NO_SHOW.
                    instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                    code: invalid_query_parameter
                    errors:
                      - parameter: status
                        message: El valor 'AGENDADA' no pertenece al conjunto permitido (CONFIRMED, RESCHEDULED, COMPLETED, CANCELLED, NO_SHOW).
                reprogramacionSinHorario:
                  summary: '`RESCHEDULED` sin `scheduled_at`'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El campo 'scheduled_at' es obligatorio para reprogramar una cita.
                    instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                    code: invalid_query_parameter
                    errors:
                      - parameter: scheduled_at
                        message: Este campo es obligatorio cuando 'status' es RESCHEDULED.
                horarioProhibido:
                  summary: '`scheduled_at` en una transición que no reprograma'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El campo 'scheduled_at' solo se admite cuando 'status' es RESCHEDULED.
                    instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                    code: invalid_query_parameter
                    errors:
                      - parameter: scheduled_at
                        message: "Enviar 'scheduled_at' solo tiene sentido junto a 'status: RESCHEDULED'."
                motivoObligatorio:
                  summary: Cancelación sin `reason`
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El campo 'reason' es obligatorio para cancelar o reprogramar una cita.
                    instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                    code: invalid_query_parameter
                    errors:
                      - parameter: reason
                        message: Este campo es obligatorio cuando 'status' es CANCELLED o RESCHEDULED.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El token es válido pero el usuario no tiene permiso sobre la cita.
            Ocurre cuando un `CLIENTE` intenta cambiar el estado, o cuando un
            `AGENTE` que no está asignado a la cita lo intenta.
            `ADMINISTRADOR` tiene acceso directo a cualquier cita.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              examples:
                rolInsuficiente:
                  summary: El rol del usuario no permite la operación
                  value:
                    type: https://housebroker.pe/errors/forbidden
                    title: Sin permisos sobre el recurso
                    status: 403
                    detail: Solo los roles AGENTE y ADMINISTRADOR pueden cambiar el estado de una cita.
                    instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                    code: forbidden
                    required_roles:
                      - AGENTE
                      - ADMINISTRADOR
                agenteNoAsignado:
                  summary: El agente no está asignado a la cita
                  value:
                    type: https://housebroker.pe/errors/forbidden
                    title: Sin permisos sobre el recurso
                    status: 403
                    detail: Solo el agente asignado a esta cita o un administrador pueden modificar su estado.
                    instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                    code: forbidden
                    required_roles:
                      - AGENTE
        '404':
          description: La cita solicitada no existe
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
              example:
                type: https://housebroker.pe/errors/resource-not-found
                title: Recurso no encontrado
                status: 404
                detail: No existe una cita con el identificador indicado.
                instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                code: resource_not_found
        '409':
          description: |
            El nuevo horario se solapa con otra cita del mismo agente. El
            cambio no se aplica parcialmente: la cita conserva su estado y su
            horario anteriores.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemConflict'
              example:
                type: https://housebroker.pe/errors/appointment-slot-conflict
                title: Conflicto de horario de cita
                status: 409
                detail: El agente ya tiene una cita confirmada el 2026-10-15 a las 17:00 (cita f1e2d3c4-5a6b-4c7d-8e9f-0a1b2c3d4e5f).
                instance: /api/v1/appointments/a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e/status
                code: appointment_slot_conflict
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/clients/{id}/profile:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags:
        - Clientes
      operationId: getClientProfile
      summary: Consultar la ficha consolidada de un cliente
      description: |
        Devuelve la ficha CRM del cliente para el panel del agente (RF-CRM-03).
        Consolida la cuenta de usuario, el perfil CRM (`client_profile`), las
        preferencias captadas y un resumen de su actividad en la plataforma.

        ### Alcance según el rol

        | Rol | Acceso |
        |---|---|
        | `AGENTE` | Solo clientes con al menos una cita asignada a su cuenta |
        | `ADMINISTRADOR` | Cualquier cliente |
        | `CLIENTE` | Sin acceso a la ficha CRM |

        Un `CLIENTE` autenticado recibe `403`. Un `AGENTE` que consulta un
        identificador inexistente, que no corresponde a un usuario `CLIENTE` o
        que no tiene citas con él recibe `404 resource_not_found`, para no
        revelar la existencia de cuentas ajenas.

        ### Datos deliberadamente ausentes

        `document_type` y `document_number` no se exponen: son PII de identidad
        y ningún requisito de esta historia los pide. Las notas internas del
        cliente (`client_profile.notes`) pertenecen a `TASK-ARC-CRM-04` y
        tampoco forman parte de esta respuesta.

        `preferences`, `budget_*` e `interest_level` pueden ser `null` cuando el
        cliente todavía no tiene un `client_profile` o cuando el asistente no ha
        captado preferencias. El frontend debe tratar esos campos como
        opcionales, no como un error.
      responses:
        '200':
          description: Ficha del cliente obtenida exitosamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfile'
              example:
                id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
                full_name: Maria Fernanda Quispe
                email: maria.quispe@correo.com
                phone: '+51 987 654 321'
                is_active: true
                created_at: '2026-01-12T10:15:00Z'
                updated_at: '2026-10-05T09:12:44Z'
                budget_min: 1800
                budget_max: 2500
                budget_currency: PEN
                preferred_district: Miraflores
                preferences:
                  mode: ALQUILER
                  property_type: DEPARTAMENTO
                  districts:
                    - Miraflores
                    - San Isidro
                  budget:
                    min: 1800
                    max: 2500
                    currency: PEN
                  bedrooms: 2
                  bathrooms: 2
                  parking: true
                  accepts_pets: true
                  required_features:
                    - ascensor
                    - cerca a transporte
                  extracted_at: '2026-10-05T09:12:44Z'
                  source_message_id: 8f2c1a60-1b2c-4d3e-8f5a-6b7c8d9e0f1a
                interest_level: 4
                summary:
                  appointments_total: 6
                  appointments_upcoming: 2
                  appointments_completed: 3
                  appointments_cancelled: 1
                  appointments_no_show: 0
                  properties_total: 4
                  favorite_properties_total: 2
                  last_appointment_at: '2026-09-28T16:00:00Z'
                  next_appointment_at: '2026-10-08T15:00:00Z'
                associated_properties:
                  - id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                    title: Departamento amoblado en Miraflores
                    district: Miraflores
                    address: Av. Larco 456, Miraflores
                    price: 2300.0
                    currency: PEN
                    property_type: DEPARTAMENTO
                    status: DISPONIBLE
                    is_active: true
                    appointments_count: 2
                    last_appointment_at: '2026-09-28T16:00:00Z'
                    next_appointment_at: '2026-10-08T15:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El token es válido pero el rol no puede consultar la ficha CRM de un
            cliente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              example:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: La ficha CRM del cliente solo está disponible para agentes y administradores.
                instance: /api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/profile
                code: forbidden
                required_roles:
                  - AGENTE
                  - ADMINISTRADOR
        '404':
          description: |
            El cliente no existe, el identificador no corresponde a un usuario
            `CLIENTE`, o el agente no tiene citas con él. Los tres casos
            responden igual para no revelar la existencia de cuentas ajenas.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
              examples:
                noExiste:
                  summary: Identificador inexistente
                  value:
                    type: https://housebroker.pe/errors/resource-not-found
                    title: Recurso no encontrado
                    status: 404
                    detail: No existe un cliente con el identificador indicado.
                    instance: /api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/profile
                    code: resource_not_found
                noAsignado:
                  summary: El cliente no tiene citas con el agente autenticado
                  value:
                    type: https://housebroker.pe/errors/resource-not-found
                    title: Recurso no encontrado
                    status: 404
                    detail: El cliente no existe o no tiene citas asignadas a tu cuenta.
                    instance: /api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/profile
                    code: resource_not_found
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/clients/{id}/history:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags:
        - Clientes
      operationId: getClientHistory
      summary: Consultar el historial consolidado de un cliente
      description: |
        Devuelve la línea de tiempo paginada del cliente (RF-CRM-03). Cada
        entrada representa un hecho ocurrido en una cita:

        | `type` | Origen | Significado |
        |---|---|---|
        | `APPOINTMENT` | `appointment.created_at` | Solicitud de visita creada |
        | `STATUS_CHANGE` | `appointment_status_change` | Transición de estado aceptada |

        Las entradas se ordenan por `occurred_at` descendente (lo más reciente
        primero), con desempate por `id` descendente. El orden es estable para
        que la paginación no repita ni omita elementos entre páginas.

        ### Alcance según el rol

        Aplica la misma regla que la ficha: un `AGENTE` solo consulta clientes
        con citas asignadas a su cuenta, un `ADMINISTRADOR` consulta cualquiera
        y un `CLIENTE` recibe `403`. Un identificador inexistente, un usuario
        que no es `CLIENTE` o un cliente sin citas con el agente reciben `404`.

        ### Filtros

        Todos los filtros son opcionales y se combinan con conjunción (AND).
        `type` se repite para aplicar un OR entre valores
        (`?type=APPOINTMENT&type=STATUS_CHANGE`). `dateFrom` y `dateTo` acotan
        `occurred_at` en `America/Lima`, con extremos inclusivos; un rango
        invertido produce `400 invalid_filter_range`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/XRequestIdParam'
        - $ref: '#/components/parameters/ClientHistoryTypeFilter'
        - $ref: '#/components/parameters/ClientHistoryDateFrom'
        - $ref: '#/components/parameters/ClientHistoryDateTo'
      responses:
        '200':
          description: Historial del cliente obtenido exitosamente
          headers:
            X-Total-Count:
              description: Total de entradas que cumplen los filtros, sin paginar.
              schema:
                type: integer
                format: int32
              example: 8
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientHistory'
              example:
                count: 2
                next: null
                previous: null
                results:
                  - id: 4d5e6f70-3c4d-5e6f-8a90-333333333333
                    type: STATUS_CHANGE
                    occurred_at: '2026-10-06T14:03:21Z'
                    appointment:
                      id: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      status: CONFIRMED
                      scheduled_at: '2026-10-08T15:00:00Z'
                      duration_minutes: 45
                      reason: El cliente confirmó la visita por teléfono.
                      property:
                        id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                        title: Departamento amoblado en Miraflores
                        district: Miraflores
                        address: Av. Larco 456, Miraflores
                      client:
                        id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
                        full_name: Maria Fernanda Quispe
                        email: maria.quispe@correo.com
                        phone: '+51 987 654 321'
                      agent:
                        id: 7c4a9d21-3b6e-4f80-9a2d-5e7c1b3f8d40
                        full_name: Brandy Sinche
                        email: brandy.sinche@housebrokerperu.com
                      created_at: '2026-10-05T09:12:44Z'
                      updated_at: '2026-10-06T14:03:21Z'
                    previous_status: PENDING
                    status: CONFIRMED
                    scheduled_at: '2026-10-08T15:00:00Z'
                    previous_scheduled_at: '2026-10-08T15:00:00Z'
                    reason: El cliente confirmó la visita por teléfono.
                    changed_by:
