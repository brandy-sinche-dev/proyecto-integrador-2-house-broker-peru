                      - parameter: type
                        message: El valor 'CHAT' no pertenece al conjunto permitido (APPOINTMENT, STATUS_CHANGE).
                rangoInvertido:
                  summary: Rango de fechas incoherente
                  value:
                    type: https://housebroker.pe/errors/invalid-filter-range
                    title: Rango de fechas inválido
                    status: 400
                    detail: El parámetro 'dateTo' no puede ser anterior a 'dateFrom'.
                    instance: /api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/history?dateFrom=2026-10-31&dateTo=2026-10-01
                    code: invalid_filter_range
                    errors:
                      - parameter: dateTo
                        message: El valor '2026-10-01' es anterior a 'dateFrom' (2026-10-31).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El token es válido pero el rol no puede consultar el historial CRM
            de un cliente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              example:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: El historial CRM del cliente solo está disponible para agentes y administradores.
                instance: /api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/history
                code: forbidden
                required_roles:
                  - AGENTE
                  - ADMINISTRADOR
        '404':
          description: |
            El cliente no existe, el identificador no corresponde a un usuario
            `CLIENTE`, o el agente no tiene citas con él. Los tres casos
