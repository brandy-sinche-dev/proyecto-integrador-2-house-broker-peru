openapi: 3.0.3

info:
  title: HouseBroker Perú - API
  description: |
    Contrato de API REST de HouseBroker Perú (Django REST Framework).

    Este documento es **el contrato acumulado del proyecto**: cada sprint
    incorpora aquí los endpoints que entrega, de modo que al cierre de la
    carrera (Sprint 7) contenga la API completa sin fragmentarse en varios
    archivos.

    ### Contratos incorporados
    | Sprint | Tarea | Alcance |
    |---|---|---|
    | Sprint 1 | `TASK-ARC-PROP-01` | CRUD de propiedades (HU-PROP-01) |
    | Sprint 2 | `TASK-ARC-PROP-02` | Catálogo paginado `GET /api/v1/properties` (HU-PROP-02) |
    | Sprint 2 | `TASK-ARC-PROP-03` | Filtros de búsqueda en `GET /api/v1/properties` (HU-PROP-03) |
    | Sprint 3 | `TASK-ARC-PROP-04` | Estado operativo y horarios de visita (HU-PROP-04) |

    ### Convenciones
    - Todos los endpoints están bajo el prefijo `/api/v1`.
    - Los parámetros de paginación son opcionales; el servidor aplica
      `DEFAULT_PAGE` y `DEFAULT_LIMIT` cuando se omiten.
    - Los filtros de búsqueda (`minPrice`, `maxPrice`, `propertyType`, `ubigeo`,
      `search`) son opcionales y se combinan con conjunción (AND).
    - Los errores se serializan como `application/problem+json` conforme a
      **RFC 7807 (Problem Details for HTTP APIs)**.
    - Los endpoints mutables exigen `Authorization: Bearer <jwt>` y rol `AGENTE`
      o `ADMINISTRADOR`. Un `401` significa token ausente o inválido; un `403`
      significa token válido sin permiso sobre el recurso.
  version: 1.3.0
  contact:
    name: Equipo HouseBroker Perú
    url: https://github.com/brandy-sinche-dev/proyecto-integrador-2-house-broker-peru
  license:
    name: Uso académico
    url: https://github.com/brandy-sinche-dev/proyecto-integrador-2-house-broker-peru/blob/main/README.md

servers:
  - url: http://localhost:8000
    description: Entorno de desarrollo local (Django + DRF)
  - url: https://staging.housebroker.pe
    description: Entorno de staging (verificado contra el SLA de 300 ms)

tags:
  - name: Propiedades
    description: Endpoints para la gestión administrativa y consulta de inmuebles
  - name: Disponibilidad
    description: |
      Estado operativo del inmueble y franjas horarias habilitadas para agendar
      visitas. Solo accesible para Agentes asignados y Administradores.

security:
  - bearerAuth: []

paths:
  /api/v1/properties:
    get:
      tags:
        - Propiedades
      operationId: listProperties
      summary: Obtener listado paginado de propiedades
      description: |
        Devuelve el catálogo de propiedades en formato paginado.

        Solo se incluyen propiedades activas (`is_active = true`). El orden por
        defecto es `created_at` descendente (más recientes primero).

        ### Búsqueda y filtros (HU-PROP-03)

        Los filtros se aplican sobre el mismo recurso del catálogo, como *query
        parameters* opcionales. Los filtros presentes se combinan entre sí con
        conjunción lógica (AND) y con `is_active = true`:

        | Filtro | Campo |
        |---|---|
        | `minPrice` / `maxPrice` | `price`, inclusivo en ambos extremos |
        | `propertyType` | `property_type` |
        | `ubigeo` | `ubigeo` del distrito (código INEI de 6 dígitos) |
        | `search` | `title` y `address` |

        Cada filtro se omite cuando no se envía. Un parámetro enviado con valor
        vacío (`?propertyType=`) equivale a omitirlo, para que el frontend pueda
        limpiar un filtro sin recargar la URL completa.

        `count` y el header `X-Total-Count` reflejan el total **después** de
        aplicar los filtros, de modo que la paginación del frontend sea
        coherente con el conjunto filtrado.

        Si la página solicitada queda fuera de rango, la respuesta es `200` con
        `results` vacío y `next` en `null`; no es un error.
      parameters:
        - name: page
          in: query
          required: false
          description: Número de página solicitada, empezando en 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: |
            Cantidad máxima de elementos por página. Si se solicita un valor
            mayor a 100, el servidor lo ajusta a 100 en lugar de devolver un error.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 12
            example: 12
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/PropertyTypeFilter'
        - $ref: '#/components/parameters/UbigeoFilter'
        - $ref: '#/components/parameters/Search'
        - name: X-Request-Id
          in: header
          required: false
          description: Identificador de correlación para trazar la petición en los logs.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Catálogo paginado obtenido exitosamente
          headers:
            X-Total-Count:
              description: Total de registros que cumplen el filtro, sin paginar.
              schema:
                type: integer
                format: int32
                example: 25
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProperties'
              examples:
                primeraPagina:
                  summary: 'Primera página: 3 de 25 propiedades'
                  value:
                    count: 25
                    next: http://localhost:8000/api/v1/properties?limit=3&page=2
                    previous: null
                    results:
                      - id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                        title: Departamento amoblado en Miraflores
                        price: 150000.0
                        moneda: PEN
                        mode: VENTA
                        address: Av. Larco 456, Miraflores
                        property_type: DEPARTAMENTO
                        is_active: true
                        created_at: '2026-09-07T10:00:00Z'
                        area_total: 85.5
                        area_construida: 78.0
                        dormitorios: 3
                        banos: 2
                        estacionamientos: 1
                        link_galeria: https://galeria.housebroker.pe/departamento-miraflores-01
                        link_planos: https://planos.housebroker.pe/departamento-miraflores-01.pdf
                        negociable: true
                        destacado: false
                        mantenimiento: 850.0
                      - id: c3d2a6b1-2b3c-5d4e-0f11-123456789001
                        title: Casa en San Isidro
                        price: 850000.0
                        moneda: USD
                        mode: VENTA
                        address: Av. El Golf 120, San Isidro
                        property_type: CASA
                        is_active: true
                        created_at: '2026-09-06T09:30:00Z'
                        area_total: 320.0
                        dormitorios: 5
                        banos: 4
                        estacionamientos: 2
                        link_galeria: https://galeria.housebroker.pe/casa-san-isidro-02
                        negociable: false
                        destacado: true
                        mantenimiento: 0.0
                      - id: b2c1f5a0-1a2b-4c3d-9e0f-222222222222
                        title: Oficina en San Borja
                        price: 4200.0
                        moneda: PEN
                        mode: ALQUILER
                        address: Av. Elmer Faucett 900, San Borja
                        property_type: OFICINA
                        is_active: true
                        created_at: '2026-09-05T15:45:00Z'
                        area_total: 120.0
                        dormitorios: 0
                        banos: 2
                        negociable: true
                        destacado: false
                        mantenimiento: 1200.0
                paginaVacia:
                  summary: Página sin resultados (búsqueda sin coincidencias)
                  value:
                    count: 0
                    next: null
                    previous: null
                    results: []
                ultimaPagina:
                  summary: 'Última página: `previous` con enlace y `next` en null'
                  value:
                    count: 25
                    next: null
                    previous: http://localhost:8000/api/v1/properties?limit=3&page=8
                    results:
                      - id: b2c1f5a0-1a2b-4c3d-9e0f-333333333333
                        title: Terreno en Cienfuegos
                        price: 310000.0
                        moneda: PEN
                        mode: VENTA
                        address: Av. Loscebadas 1200, Cienfuegos
                        property_type: TERRENO
                        is_active: true
                        created_at: '2026-09-01T08:00:00Z'
                        area_total: 450.0
                        negociable: true
                        destacado: false
                        mantenimiento: 0.0
                catalogoFiltrado:
                  summary: >-
                    Consulta con filtros: `count` refleja solo el conjunto filtrado
                  value:
                    count: 2
                    next: null
                    previous: null
                    results:
                      - id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                        title: Departamento amoblado en Miraflores
                        price: 150000.0
                        moneda: PEN
                        mode: VENTA
                        address: Av. Larco 456, Miraflores
                        property_type: DEPARTAMENTO
                        is_active: true
                        created_at: '2026-09-07T10:00:00Z'
                        area_total: 85.5
                        dormitorios: 3
                        banos: 2
                        estacionamientos: 1
                        negociable: true
                        destacado: false
                        mantenimiento: 850.0
                      - id: c3d2a6b1-2b3c-5d4e-0f11-123456789001
                        title: Casa en San Isidro
                        price: 850000.0
                        moneda: USD
                        mode: VENTA
                        address: Av. El Golf 120, San Isidro
                        property_type: CASA
                        is_active: true
                        created_at: '2026-09-06T09:30:00Z'
                        area_total: 320.0
                        dormitorios: 5
                        banos: 4
                        estacionamientos: 2
                        negociable: false
                        destacado: true
                        mantenimiento: 0.0
        '400':
          description: Parámetros de consulta inválidos
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                paginacionInvalida:
                  summary: Parámetro de paginación fuera de rango
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El parámetro 'page' debe ser un entero mayor o igual a 1.
                    instance: /api/v1/properties?page=0
                    code: invalid_query_parameter
                    errors:
                      - parameter: page
                        message: El valor '0' es menor que el mínimo permitido (1).
                enumDeFiltroInvalido:
                  summary: '`propertyType` fuera del enum'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El parámetro 'propertyType' admite los valores DEPARTAMENTO, CASA, TERRENO, OFICINA.
                    instance: /api/v1/properties?propertyType=DUPLEX
                    code: invalid_query_parameter
                    errors:
                      - parameter: propertyType
                        message: El valor 'DUPLEX' no pertenece al conjunto permitido (DEPARTAMENTO, CASA, TERRENO, OFICINA).
                ubigeoMalFormado:
                  summary: '`ubigeo` que no cumple el patrón de 6 dígitos'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El parámetro 'ubigeo' debe ser un código INEI de 6 dígitos.
                    instance: /api/v1/properties?ubigeo=1501
                    code: invalid_query_parameter
                    errors:
                      - parameter: ubigeo
                        message: El valor '1501' no cumple el formato de 6 dígitos (patrón ^\d{6}$).
                searchDemasiadoCorto:
                  summary: '`search` por debajo del mínimo de caracteres'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El parámetro 'search' debe tener entre 2 y 120 caracteres.
                    instance: /api/v1/properties?search=a
                    code: invalid_query_parameter
                    errors:
                      - parameter: search
                        message: El valor 'a' tiene 1 carácter y el mínimo es 2.
                rangoDePrecioInvertido:
                  summary: '`minPrice` mayor que `maxPrice`'
                  value:
                    type: https://housebroker.pe/errors/invalid-filter-range
                    title: Rango de precio incoherente
                    status: 400
                    detail: '`minPrice` no puede ser mayor que `maxPrice`.'
                    instance: /api/v1/properties?minPrice=450000&maxPrice=150000
                    code: invalid_filter_range
                    errors:
                      - parameter: minPrice
                        message: El valor '450000.0' es mayor que 'maxPrice' (150000.0).
                variosErrores:
                  summary: 'Múltiples filtros rechazados en una sola respuesta'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetros de consulta inválidos
                    status: 400
                    detail: Se detectaron 2 parámetros de consulta inválidos.
                    instance: /api/v1/properties?propertyType=DUPLEX&search=a
                    code: invalid_query_parameter
                    errors:
                      - parameter: propertyType
                        message: El valor 'DUPLEX' no pertenece al conjunto permitido (DEPARTAMENTO, CASA, TERRENO, OFICINA).
                      - parameter: search
                        message: El valor 'a' tiene 1 carácter y el mínimo es 2.
        '500':
          description: Error interno del servidor
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemInternalServerError'
              example:
                type: https://housebroker.pe/errors/internal-server-error
                title: Error interno del servidor
                status: 500
                detail: No fue posible completar la consulta del catálogo de propiedades.
                instance: /api/v1/properties?page=1&limit=12
                code: internal_server_error
                request_id: 8b1a0f5c-2d3e-4a5b-9c7d-0e1f2a3b4c5d

    post:
      tags:
        - Propiedades
      operationId: createProperty
      summary: Registrar una nueva propiedad
      description: Crea un inmueble en el catálogo. El servidor asigna `id` y `created_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '201':
          description: Propiedad creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          description: Datos de entrada inválidos o faltantes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
        '500':
          description: Error interno del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemInternalServerError'

  /api/v1/properties/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador único del inmueble.
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Propiedades
      operationId: getProperty
      summary: Obtener detalle de una propiedad
      description: Devuelve un inmueble por su identificador único.
      responses:
        '200':
          description: Detalle de la propiedad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
        '500':
          description: Error interno del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemInternalServerError'

    put:
      tags:
        - Propiedades
      operationId: updateProperty
      summary: Actualizar una propiedad existente
      description: |
        Reemplaza los campos commercializables del inmueble. `id`, `is_active` y
        `created_at` se conservan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyInput'
      responses:
        '200':
          description: Propiedad actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '400':
          description: Datos de actualización inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
        '500':
          description: Error interno del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemInternalServerError'

    delete:
      tags:
        - Propiedades
      operationId: deleteProperty
      summary: Eliminación lógica de una propiedad
      description: |
        Marca el inmueble como inactivo (`is_active = false`) sin eliminarlo del
        catálogo, de modo que el registro siga siendo auditable.
      responses:
        '200':
          description: Propiedad desactivada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
        '500':
          description: Error interno del servidor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemInternalServerError'

  /api/v1/properties/{id}/status:
    parameters:
      - $ref: '#/components/parameters/PropertyId'

    patch:
      tags:
        - Disponibilidad
      operationId: updatePropertyStatus
      summary: Actualizar el estado operativo de una propiedad
      description: |
        Cambia el estado operativo del inmueble (RF-PROP-04). Es un `PATCH`
        semántico: el cuerpo puede contener `status`, `reason` o ambos, y el
        resto de campos del inmueble queda intacto.

        `status` gobierna la visibilidad en el catálogo, no el borrado físico:

        | Estado | En catálogo | Agendable |
        |---|---|---|
        | `DISPONIBLE` | Sí | Sí |
        | `RESERVADO` | Sí | No |
        | `ALQUILADO` | Sí | No |
        | `VENDIDO` | Sí | No |
        | `SUSPENDIDO` | No (`is_active = false`) | No |

        La transición a `SUSPENDIDO` es la que retira el inmueble del catálogo
        mediante eliminación lógica. Volver a `DISPONIBLE` lo reactiva. Es
        intencionalmente distinta de `DELETE /api/v1/properties/{id}`, que
        también desactiva pero no deja registro de la suspensión.

        No hay transición válida desde `VENDIDO` ni `ALQUILADO`: son estados
        terminales y un intento de revertirlos produce `409`.

        El estado anterior se devuelve en `previous_status` para que el frontend
        pueda revertir la UI si observa un fallo de red después de aplicar el
        cambio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyStatusInput'
            examples:
              cambioDeEstado:
                summary: Marcar como reservada con motivo
                value:
                  status: RESERVADO
                  reason: El propietario inicio tramite de reserva con seña.
              soloEstado:
                summary: Reactivar un inmueble suspendido
                value:
                  status: DISPONIBLE
      responses:
        '200':
          description: Estado actualizado exitosamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyStatusResult'
              example:
                id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                status: RESERVADO
                previous_status: DISPONIBLE
                is_active: true
                reason: El propietario inicio tramite de reserva con seña.
                changed_by: 7c4a9d21-3b6e-4f80-9a2d-5e7c1b3f8d40
                changed_at: '2026-09-30T14:20:00Z'
        '400':
          description: Cuerpo inválido o transición no permitida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                estadoInvalido:
                  summary: '`status` fuera del enum'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El campo 'status' admite los valores DISPONIBLE, RESERVADO, ALQUILADO, VENDIDO, SUSPENDIDO.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                    code: invalid_query_parameter
                    errors:
                      - parameter: status
                        message: El valor 'ALQUILANDO' no pertenece al conjunto permitido (DISPONIBLE, RESERVADO, ALQUILADO, VENDIDO, SUSPENDIDO).
                cuerpoVacio:
                  summary: 'PATCH sin `status`'
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El campo 'status' es obligatorio para actualizar el estado operativo.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                    code: invalid_query_parameter
                    errors:
                      - parameter: status
                        message: Este campo es obligatorio.
                transicionInvalida:
                  summary: Transición desde un estado terminal
                  value:
                    type: https://housebroker.pe/errors/invalid-property-transition
                    title: Transición de estado no permitida
                    status: 400
                    detail: No se puede pasar de 'VENDIDO' a 'DISPONIBLE'. Los estados VENDIDO y ALQUILADO son terminales.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                    code: invalid_property_transition
                    errors:
                      - parameter: status
                        message: La transición VENDIDO -> DISPONIBLE no está permitida.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
        '409':
          description: |
            El inmueble tiene visitas confirmadas en la franja afectada, o la
            escritura concurrente que colisiona con otra actualización.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemConflict'
              example:
                type: https://housebroker.pe/errors/property-state-conflict
                title: Conflicto de estado del inmueble
                status: 409
                detail: No se puede suspender el inmueble porque tiene 2 visitas confirmadas en las próximas 48 horas.
                instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                code: property_state_conflict
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/properties/{id}/schedules:
    parameters:
      - $ref: '#/components/parameters/PropertyId'

    get:
      tags:
        - Disponibilidad
      operationId: getPropertySchedules
      summary: Obtener las franjas horarias de una propiedad
      description: |
        Devuelve las franjas habilitadas para agendar visitas al inmueble,
        agrupadas por día de la semana.

        Cada franja es un intervalo `[start_time, end_time)` en formato
        `HH:MM` (24 h). El extremo derecho es **exclusivo**: una franja
        `09:00-12:00` y otra `12:00-15:00` son contiguas, no solapadas.
      responses:
        '200':
          description: Franjas obtenidas exitosamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySchedules'
              example:
                property_id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                timezone: America/Lima
                total_slots: 3
                days:
                  - weekday: LUNES
                    slots:
                      - id: 9a7b1c2d-3e4f-5a6b-8c7d-9e0f1a2b3c4d
                        start_time: '09:00'
                        end_time: '12:00'
                        is_active: true
                  - weekday: MARTES
                    slots: []
                  - weekday: MIERCOLES
                    slots: []
                  - weekday: JUEVES
                    slots: []
                  - weekday: VIERNES
                    slots: []
                  - weekday: SABADO
                    slots:
                      - id: 9a7b1c2d-3e4f-5a6b-8c7d-9e0f1a2b3c4f
                        start_time: '10:00'
                        end_time: '13:00'
                        is_active: true
                  - weekday: DOMINGO
                    slots: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Disponibilidad
      operationId: replacePropertySchedules
      summary: Reemplazar las franjas horarias de una propiedad
      description: |
        Operación de **reemplazo completo** (idempotente por diseño): el cuerpo
        es la nueva configuración completa de la semana. Los bloques que no
        vienen en el cuerpo se desactivan (`is_active = false`) en lugar de
        borrarse, para conservar el historial de citas ya agendadas.

        Se eligió `PUT` y no `PATCH` porque editar un solo bloque dejaría el resto
        ambiguo. Un `PUT` con `days: []` deja el inmueble sin franjas, que es un
        estado válido: bloquea el agendamiento sin desactivar la propiedad.

        #### Reglas de validación

        | Regla | Rechazo |
        |---|---|
        | `start_time` anterior a `end_time` | `400` |
        | Duración mínima de 30 minutos | `400` |
        | Duración máxima de 8 horas | `400` |
        | Sin solapamiento entre franjas del mismo día | `400` |
        | Sin duplicar el mismo día de la semana | `400` |
        | Máximo 6 franjas por día | `400` |
        | Máximo 28 franjas por semana | `400` |

        Los horarios se interpretan en la zona horaria `America/Lima` que
        devuelve el `GET`. No se aceptan sufijos de zona ni offsets UTC en los
        valores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertySchedulesInput'
            examples:
              semanaCompleta:
                summary: Lunes a viernes, 09:00 a 18:00
                value:
                  days:
                    - weekday: LUNES
                      slots:
                        - start_time: '09:00'
                          end_time: '12:00'
                        - start_time: '14:00'
                          end_time: '18:00'
                    - weekday: MARTES
                      slots:
                        - start_time: '09:00'
                          end_time: '18:00'
                    - weekday: MIERCOLES
                      slots:
                        - start_time: '09:00'
                          end_time: '18:00'
                    - weekday: JUEVES
                      slots:
                        - start_time: '09:00'
                          end_time: '18:00'
                    - weekday: VIERNES
                      slots:
                        - start_time: '09:00'
                          end_time: '13:00'
              sinFranjas:
                summary: Sin franjas, sin desactivar el inmueble
                value:
                  days: []
      responses:
        '200':
          description: Franjas reemplazadas exitosamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySchedules'
        '400':
          description: Franjas que incumplen las reglas de rango o solapamiento
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                rangoInvertido:
                  summary: '`start_time` posterior a `end_time`'
                  value:
                    type: https://housebroker.pe/errors/invalid-time-range
                    title: Rango horario inválido
                    status: 400
                    detail: La franja de LUNES tiene 'start_time' 18:00 posterior a 'end_time' 12:00.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
                    code: invalid_time_range
                    errors:
                      - parameter: days[0].slots[0]
                        message: "start_time' (18:00) debe ser anterior a 'end_time' (12:00)."
                duracionMinima:
                  summary: 'Franja de 15 minutos'
                  value:
                    type: https://housebroker.pe/errors/invalid-time-range
                    title: Rango horario inválido
                    status: 400
                    detail: La franja de LUNES dura 15 minutos y el mínimo es 30.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
                    code: invalid_time_range
                    errors:
                      - parameter: days[0].slots[1]
                        message: La duración de la franja (15 min) es menor que el mínimo (30 min).
                solapamiento:
                  summary: Dos franjas que se superponen en el mismo día
                  value:
                    type: https://housebroker.pe/errors/schedule-overlap
                    title: Franjas horarias solapadas
                    status: 400
                    detail: Las franjas 09:00-12:00 y 11:00-13:00 de LUNES se solapan.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
                    code: schedule_overlap
                    errors:
                      - parameter: days[0].slots[1]
                        message: Se solapa con la franja 09:00-12:00.
                formatoDeHora:
                  summary: '`start_time` fuera del patrón HH:MM'
                  value:
                    type: https://housebroker.pe/errors/invalid-time-range
                    title: Rango horario inválido
                    status: 400
                    detail: El campo 'start_time' debe usar el formato HH:MM en 24 horas.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
                    code: invalid_time_range
                    errors:
                      - parameter: days[0].slots[0].start_time
                        message: El valor '9:00 am' no cumple el formato HH:MM (patrón ^([01]\d|2[0-3]):[0-5]\d$).
                diaDuplicado:
                  summary: 'Mismo `weekday` repetido'
                  value:
                    type: https://housebroker.pe/errors/invalid-time-range
                    title: Rango horario inválido
                    status: 400
                    detail: El día 'LUNES' aparece más de una vez en la configuración semanal.
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
                    code: invalid_time_range
                    errors:
                      - parameter: days[1]
                        message: El día 'LUNES' está duplicado; agrupe ambas listas de franjas en una sola entrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
        '409':
          description: |
            El inmueble tiene citas ya confirmadas en franjas que el reemplazo
            desactivaría. El cliente debe reasignar o cancelar esas visitas antes
            de aplicar el cambio.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemConflict'
              example:
                type: https://housebroker.pe/errors/schedule-has-bookings
                title: La configuración choca con visitas agendadas
                status: 409
                detail: 3 franjas a desactivar tienen visitas confirmadas.
                instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
                code: schedule_has_bookings
                errors:
                  - parameter: days[1].slots[0]
                    message: La franja 14:00-18:00 del JUEVES tiene 1 visita confirmada (cita a9c1d2e3).
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido por `POST /api/v1/auth/login` y enviado como
        `Authorization: Bearer <token>`. Cubre los tres roles del MVP:
        `CLIENTE`, `AGENTE` y `ADMINISTRADOR`.

        El cliente adjunta el token en `frontend/src/services/axios.ts` leyendo
        `localStorage.hb_token`.

  responses:
    Unauthorized:
      description: Token ausente, vencido o con firma inválida
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemUnauthorized'
          example:
            type: https://housebroker.pe/errors/unauthorized
            title: No autenticado
            status: 401
            detail: Falta el encabezado 'Authorization' con un token Bearer válido.
            instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
            code: unauthorized
    Forbidden:
      description: |
        El token es válido pero el usuario no tiene permiso sobre el recurso.
        Ocurre cuando un `CLIENTE` intenta modificar el estado o los horarios,
        o cuando un `AGENTE` que no está asignado al inmueble intenta hacerlo.
        `ADMINISTRADOR` tiene acceso directo a cualquier inmueble.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemForbidden'
          examples:
            rolInsuficiente:
              summary: El rol del usuario no permite la operación
              value:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: Solo los roles AGENTE y ADMINISTRADOR pueden actualizar el estado de una propiedad.
                instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                code: forbidden
                required_roles:
                  - AGENTE
                  - ADMINISTRADOR
            agenteNoAsignado:
              summary: El agente no está asignado al inmueble
              value:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: Solo el agente asignado a este inmueble o un administrador pueden modificar sus horarios.
                instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                code: forbidden
                required_roles:
                  - AGENTE
    InternalServerError:
      description: Error interno del servidor
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemInternalServerError'
          example:
            type: https://housebroker.pe/errors/internal-server-error
            title: Error interno del servidor
            status: 500
            detail: No fue posible completar la operación solicitada.
            instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
            code: internal_server_error
            request_id: 8b1a0f5c-2d3e-4a5b-9c7d-0e1f2a3b4c5d

  parameters:
    PropertyId:
      name: id
      in: path
      required: true
      description: Identificador único del inmueble.
      schema:
        type: string
        format: uuid

    MinPrice:
      name: minPrice
      in: query
      required: false
      description: |
        Precio mínimo del inmueble, en la moneda de `price`. El extremo es
        **inclusivo**: `minPrice=150000` incluye el inmueble de 150000.0.
      schema:
        type: number
        format: double
        minimum: 0.0001
      example: 150000.0
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      description: |
        Precio máximo del inmueble, en la moneda de `price`. El extremo es
        **inclusivo**: `maxPrice=150000` incluye el inmueble de 150000.0.
      schema:
        type: number
        format: double
        minimum: 0.0001
      example: 450000.0
    PropertyTypeFilter:
      name: propertyType
      in: query
      required: false
      description: |
        Tipo de inmueble. Acepta **uno o varios valores** del enum `PropertyType`;
        varios valores actúa como un OR dentro de este filtro
        (`?propertyType=CASA&propertyType=DEPARTAMENTO`).

        Repetir el parámetro es la única forma soportada de combinar valores: no
        se acepta una lista separada por comas. Un valor fuera del enum produce
        `400`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PropertyType'
      style: form
      explode: true
      example:
        - CASA
        - DEPARTAMENTO
    UbigeoFilter:
      name: ubigeo
      in: query
      required: false
      description: |
        Código INEI de 6 dígitos del distrito. Acepta **uno o varios valores**
        con la misma semántica OR que `propertyType`
        (`?ubigeo=150131&ubigeo=150143`).

        Los códigos válidos provienen del catálogo de distritos de Lima
        Metropolitana. Un código mal formado (no numérico o de longitud distinta
        a 6) produce `400`.
      schema:
        type: array
        items:
          type: string
          pattern: '^[0-9]{6}$'
      style: form
      explode: true
      example:
        - '150131'
        - '150143'
    Search:
      name: search
      in: query
      required: false
      description: |
        Búsqueda de texto libre sobre `title` y `address`. La comparación es
        **case-insensitive** y sin distinción de acentos, de modo que
        `search=depto` encuentra "Departamento..." y `search=MIRAFLORES`
        encuentra "Miraflores".

        Los espacios iniciales, finales y dobles se colapsan antes de comparar.
        Se exige un mínimo de 2 caracteres para acotar el costo de la búsqueda;
        un texto más corto produce `400`.
      schema:
        type: string
        minLength: 2
        maxLength: 120
      example: departamento miraflores

  headers:
    XRequestId:
      description: Identificador de correlación devuelto para trazar la petición.
      schema:
        type: string
        format: uuid

  schemas:
    Property:
      type: object
      description: Representación de un inmueble del catálogo.
      required:
        - id
        - title
        - price
        - moneda
        - mode
        - address
        - property_type
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único del inmueble.
          example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
        title:
          type: string
          minLength: 1
          description: Título comercial del anuncio.
          example: Departamento amoblado en Miraflores
        price:
          type: number
          format: double
          minimum: 0.0001
          description: Monto del precio en la moneda indicada por `moneda`. Siempre mayor que 0.
          example: 150000.0
        moneda:
          $ref: '#/components/schemas/Moneda'
        mode:
          $ref: '#/components/schemas/TransactionMode'
        address:
          type: string
          minLength: 1
          description: Dirección completa dentro de Lima Metropolitana.
          example: Av. Larco 456, Miraflores
        property_type:
          $ref: '#/components/schemas/PropertyType'
        is_active:
          type: boolean
          description: |
            Indica si el inmueble está visible en el catálogo. Se desactiva
            mediante eliminación lógica (`DELETE`).
          example: true
        created_at:
          type: string
          format: date-time
          description: Fecha y hora de registro del inmueble en formato ISO 8601.
          example: '2026-09-07T10:00:00Z'
        area_total:
          type: number
          format: double
          minimum: 0
          description: Área total del inmueble en metros cuadrados.
          example: 85.5
        area_construida:
          type: number
          format: double
          minimum: 0
          description: Área construida en metros cuadrados.
          example: 78.0
        dormitorios:
          type: integer
          minimum: 0
          description: Cantidad de dormitorios.
          example: 3
        banos:
          type: integer
          minimum: 0
          description: Cantidad de baños.
          example: 2
        estacionamientos:
          type: integer
          minimum: 0
          description: Cantidad de estacionamientos.
          example: 1
        link_galeria:
          type: string
          format: uri
          description: Enlace externo a la galería de fotografías.
          example: https://galeria.housebroker.pe/departamento-miraflores-01
        link_planos:
          type: string
          format: uri
          description: Enlace externo a los planos del inmueble.
          example: https://planos.housebroker.pe/departamento-miraflores-01.pdf
        negociable:
          type: boolean
          description: Indica si el precio admite negociación.
          example: true
        destacado:
          type: boolean
          description: Indica si el anuncio se destaca en el catálogo.
          example: false
        mantenimiento:
          type: number
          format: double
          minimum: 0
          description: Costo mensual de mantenimiento, en la moneda de `moneda`.
          example: 850.0

    PropertyInput:
      type: object
      description: Cuerpo de entrada para crear o actualizar una propiedad.
      required:
        - title
        - price
        - mode
        - address
        - property_type
      properties:
        title:
          type: string
          minLength: 1
          description: Título comercial del anuncio.
          example: Departamento amoblado en Miraflores
        price:
          type: number
          format: double
          minimum: 0.0001
          description: Monto del precio en la moneda indicada por `moneda`. Siempre mayor que 0.
          example: 150000.0
        moneda:
          allOf:
            - $ref: '#/components/schemas/Moneda'
          description: |
            Moneda del precio. Si se omite, el servidor assume `PEN`.
          default: PEN
        mode:
          $ref: '#/components/schemas/TransactionMode'
        address:
          type: string
          minLength: 1
          description: Dirección completa dentro de Lima Metropolitana.
          example: Av. Larco 456, Miraflores
        property_type:
          $ref: '#/components/schemas/PropertyType'
        area_total:
          type: number
          format: double
          minimum: 0
          description: Área total del inmueble en metros cuadrados.
          example: 85.5
        area_construida:
          type: number
          format: double
          minimum: 0
          description: Área construida en metros cuadrados.
          example: 78.0
        dormitorios:
          type: integer
          minimum: 0
          description: Cantidad de dormitorios.
          example: 3
        banos:
          type: integer
          minimum: 0
          description: Cantidad de baños.
          example: 2
        estacionamientos:
          type: integer
          minimum: 0
          description: Cantidad de estacionamientos.
          example: 1
        link_galeria:
          type: string
          format: uri
          description: Enlace externo a la galería de fotografías.
          example: https://galeria.housebroker.pe/departamento-miraflores-01
        link_planos:
          type: string
          format: uri
          description: Enlace externo a los planos del inmueble.
          example: https://planos.housebroker.pe/departamento-miraflores-01.pdf
        negociable:
          type: boolean
          description: Indica si el precio admite negociación.
          example: true
        destacado:
          type: boolean
          description: Indica si el anuncio se destaca en el catálogo.
          example: false
        mantenimiento:
          type: number
          format: double
          minimum: 0
          description: Costo mensual de mantenimiento, en la moneda de `moneda`.
          example: 850.0

    PropertyType:
      type: string
      description: Categoría del inmueble.
      enum:
        - DEPARTAMENTO
        - CASA
        - TERRENO
        - OFICINA
      example: DEPARTAMENTO

    Moneda:
      type: string
      description: Moneda en la que se exprima el precio y el mantenimiento.
      enum:
        - PEN
        - USD
      example: PEN

    TransactionMode:
      type: string
      description: Modalidad de la operación del inmueble.
      enum:
        - VENTA
        - ALQUILER
      example: VENTA

    UserRole:
      type: string
      description: |
        Rol del usuario autenticado. Determina si puede consultar el catálogo y
        si puede modificar estado y horarios.
      enum:
        - CLIENTE
        - AGENTE
        - ADMINISTRADOR
      example: AGENTE

    PropertyStatus:
      type: string
      description: |
        Estado operativo del inmueble (RF-PROP-04). Es distinto de `is_active`:
        `is_active` decide la visibilidad en el catálogo, mientras `status`
        describe en qué etapa comercial está. Los cuatro primeros estados
        mantienen el inmueble visible; `SUSPENDIDO` lo retira del catálogo.
      enum:
        - DISPONIBLE
        - RESERVADO
        - ALQUILADO
        - VENDIDO
        - SUSPENDIDO

    PropertyStatusInput:
      type: object
      description: |
        Cuerpo del `PATCH` de estado. Solo se procesan `status` y `reason`; el
        resto de campos del inmueble no se ven afectados.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/PropertyStatus'
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: |
            Motivo del cambio, en español. Obligatorio para transiciones a
            `SUSPENDIDO`, `RESERVADO`, `ALQUILADO` y `VENDIDO` porque son
            decisiones comerciales auditables; opcional al volver a
            `DISPONIBLE`.
          example: El propietario inicio tramite de reserva con seña.
      example:
        status: RESERVADO
        reason: El propietario inicio tramite de reserva con seña.

    PropertyStatusResult:
      type: object
      description: |
        Estado vigente tras aplicar el parche, con trazabilidad del cambio.
        `status` es el estado nuevo y `previous_status` el anterior.
      required:
        - id
        - status
        - previous_status
        - is_active
        - changed_by
        - changed_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del inmueble al que se aplicó el cambio.
        status:
          $ref: '#/components/schemas/PropertyStatus'
        previous_status:
          allOf:
            - $ref: '#/components/schemas/PropertyStatus'
          description: |
            Estado antes del cambio. Permite al frontend revertir la UI cuando
            observa un fallo de red después de haber aplicado el parche
            optimista.
        is_active:
          type: boolean
          description: |
            Visibilidad resultante en el catálogo. Es `false` exactamente
            cuando `status` es `SUSPENDIDO`.
          example: true
        reason:
          type: string
          nullable: true
          description: Motivo registrado para el cambio, si se envió.
          example: El propietario inicio tramite de reserva con seña.
        changed_by:
          type: string
          format: uuid
          description: Usuario que ejecutó la transición.
        changed_at:
          type: string
          format: date-time
          description: Momento del cambio en formato ISO 8601.
          example: '2026-09-30T14:20:00Z'

    Weekday:
      type: string
      description: |
        Día de la semana. Los horarios se repiten semanalmente: un bloque de
        `LUNES` aplica a todos los lunes futuros, sin fecha concreta.
      enum:
        - LUNES
        - MARTES
        - MIERCOLES
        - JUEVES
        - VIERNES
        - SABADO
        - DOMINGO
      example: LUNES

    TimeSlotInput:
      type: object
      description: |
        Franja horaria en formato de 24 horas, con intervalo semiabierto
        `[start_time, end_time)`. El solapamiento entre dos franjas equivale a
        intersección no vacía de esos intervalos, de modo que 09:00-12:00 y
        12:00-15:00 son contiguas y válidas.
      required:
        - start_time
        - end_time
      additionalProperties: false
      properties:
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: |
            Hora de inicio en `HH:MM`. Valida tanto el formato como el rango
            00:00-23:59; un valor como `9:00 am` o `25:00` produce `400`.
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: |
            Hora de cierre en `HH:MM`, posterior a `start_time`. La duración
            resultante se valida entre 30 minutos y 8 horas.
          example: '12:00'

    WeekdayScheduleInput:
      type: object
      description: |
        Conjunto de franjas de un día concreto. Máximo 6 franjas por día.
      required:
        - weekday
        - slots
      additionalProperties: false
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        slots:
          type: array
          minItems: 1
          maxItems: 6
          description: |
            Franjas del día, ordenadas por `start_time` y sin solapamientos. Una
            lista vacía se rechaza con `400`: los días sin atención se omiten
            del cuerpo, no se declaran con `slots: []`.
          items:
            $ref: '#/components/schemas/TimeSlotInput'
      example:
        weekday: LUNES
        slots:
          - start_time: '09:00'
            end_time: '12:00'
          - start_time: '14:00'
            end_time: '18:00'

    PropertySchedulesInput:
      type: object
      description: |
        Configuración semanal completa que reemplaza a la anterior. Máximo 28
        franjas en total. Un día no incluido queda sin franjas; `days: []`
        deja el inmueble sin posibilidad de agendamiento sin desactivarlo.
      required:
        - days
      additionalProperties: false
      properties:
        days:
          type: array
          minItems: 0
          maxItems: 7
          description: |
            Días configurables. Cada día de la semana aparece **a lo sumo una
            vez**: un `weekday` repetido produce `400` en lugar de fusionar en
            silencio las listas de franjas.
          items:
            $ref: '#/components/schemas/WeekdayScheduleInput'
      example:
        days:
          - weekday: LUNES
            slots:
              - start_time: '09:00'
                end_time: '12:00'
              - start_time: '14:00'
                end_time: '18:00'
          - weekday: SABADO
            slots:
              - start_time: '10:00'
                end_time: '13:00'

    ScheduleSlot:
      type: object
      description: |
        Franja almacenada: los mismos campos de `TimeSlotInput` más su
        identidad y su estado de activación.
      required:
        - id
        - start_time
        - end_time
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la franja, estable entre reemplazos.
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora de inicio en `HH:MM`.
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora de cierre en `HH:MM`.
          example: '12:00'
        is_active:
          type: boolean
          description: |
            Indica si la franja admite visitas. Un `PUT` desactiva las franjas
            ausentes del cuerpo en lugar de borrarlas, de modo que las citas ya
            agendadas conserven su referencia.
          example: true

    WeekdaySchedule:
      type: object
      description: |
        Día con sus franjas, tal como quedan tras el reemplazo. A diferencia de
        `WeekdayScheduleInput`, admite `slots: []` y cada franja trae `id` e
        `is_active`.
      required:
        - weekday
        - slots
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        slots:
          type: array
          description: Franjas vigentes del día, ordenadas por `start_time`.
          items:
            $ref: '#/components/schemas/ScheduleSlot'

    PropertySchedules:
      type: object
      description: |
        Estado completo de la agenda semanal del inmueble. Siempre incluye los
        siete días: los que no tienen franjas vienen con `slots: []`, para que
        el frontend pueda pintar la semana completa sin tratar la ausencia como
        un día no cargado.
      required:
        - property_id
        - timezone
        - total_slots
        - days
      properties:
        property_id:
          type: string
          format: uuid
          description: Inmueble al que corresponden estas franjas.
        timezone:
          type: string
          description: |
            Zona horaria en la que se interpretan todas las horas del recurso.
            Fijada por el MVP a `America/Lima`; el frontend no debe aplicar su
            propia conversión sobre los valores `HH:MM`.
          example: America/Lima
        total_slots:
          type: integer
          format: int32
          minimum: 0
          description: Suma de franjas activas en la semana.
          example: 4
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Los siete días de la semana, en orden de lunes a domingo.
          items:
            $ref: '#/components/schemas/WeekdaySchedule'

    PaginatedProperties:
      type: object
      description: Envoltorio paginado del catálogo de propiedades.
      required:
        - count
        - next
        - previous
        - results
      additionalProperties: false
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Total de registros que cumplen el filtro, sin paginar.
          example: 25
        next:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la siguiente página, o `null` si la página
            solicitada es la última.
          example: http://localhost:8000/api/v1/properties?limit=3&page=2
        previous:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la página anterior, o `null` si la página
            solicitada es la primera.
          example: null
        results:
          type: array
          description: Propiedades correspondientes a la página solicitada.
          items:
            $ref: '#/components/schemas/Property'

    Problem:
      type: object
      description: |
        Objeto base de error conforme a **RFC 7807** (Problem Details for
        HTTP APIs). Los campos `type`, `title`, `status` y `detail` son los
        member names definidos por el estándar; `code`, `errors` y `request_id`
        son extensiones propias de la API.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema.
          example: https://housebroker.pe/errors/invalid-query-parameter
        title:
          type: string
          description: Resumen corto y estable del tipo de problema.
          example: Parámetro de consulta inválido
        status:
          type: integer
          format: int32
          description: Código de estado HTTP, replicado por comodidad del cliente.
          example: 400
        detail:
          type: string
          description: Explicación del problema en español, legible por una persona.
          example: El parámetro 'page' debe ser un entero mayor o igual a 1.
        instance:
          type: string
          format: uri-reference
          description: Ruta de la petición que originó el problema.
          example: /api/v1/properties?page=0
        code:
          type: string
          description: Código de error estable y programático.
          example: invalid_query_parameter
        request_id:
          type: string
          format: uuid
          description: Identificador de correlación para soporte y trazabilidad.

    ProblemBadRequest:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
            - errors
          properties:
            code:
              type: string
              description: |
                Código de error estable. Para la query del catálogo,
                `invalid_query_parameter` cubre el rechazo de un parámetro
                individual por tipo, formato, longitud o pertenencia a un enum;
                `invalid_filter_range` cubre la incoherencia entre `minPrice` y
                `maxPrice`, que es válida en cada parámetro por separado pero
                rechazada en conjunto.
              example: invalid_query_parameter
            errors:
              type: array
              description: |
                Detalle del error por cada parámetro o campo rechazado. La
                validación no corta en el primer fallo: la lista contiene una
                entrada por cada parámetro inválido de la misma petición, de modo
                que el frontend pueda marcar todos los controles con error a la
                vez. El orden sigue el de los parámetros declarados en la
                operación.
              items:
                type: object
                required:
                  - parameter
                  - message
                properties:
                  parameter:
                    type: string
                    description: Nombre del parámetro o campo rechazado.
                    example: page
                  message:
                    type: string
                    description: |
                      Motivo del rechazo, en español. Redactado de forma que
                      pueda mostrarse tal cual junto al control del formulario,
                      sin código ni jargon.
                    example: El valor '0' es menor que el mínimo permitido (1).

    ProblemNotFound:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: Código de error estable.
              example: resource_not_found

    ProblemUnauthorized:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: |
                Código de error estable. `unauthorized` cubre el token ausente,
                vencido o con firma inválida.
              example: unauthorized

    ProblemForbidden:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: |
                Código de error estable. `forbidden` significa que el token es
                válido y el recurso existe, pero el usuario no tiene permiso
                sobre él. No confundir con `404`: el backend no debe revelar la
                existencia de un inmueble ajeno al Agente que lo consulta.
              example: forbidden
            required_roles:
              type: array
              description: |
                Roles que sí habrían tenido permiso. Permite al frontend mostrar
                un mensaje accionable ("solo administradores pueden hacer esto")
                en lugar de un error genérico. Opcional: se omite cuando la
                regla depende del recurso concreto y no de un rol.
              items:
                $ref: '#/components/schemas/UserRole'

    ProblemConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: |
                Código de error estable. `property_state_conflict` impide
                suspender un inmueble con visitas confirmadas;
                `schedule_has_bookings` impide desactivar franjas que ya tienen
                citas. El cambio no se aplica parcialmente.
              example: schedule_has_bookings
            errors:
              type: array
              description: |
                Franjas o campos en conflicto. Permite al frontend señalar los
                bloques concretos que deben reasignarse en lugar de mostrar un
                error genérico.
              items:
                type: object
                required:
                  - parameter
                  - message
                properties:
                  parameter:
                    type: string
                    description: Ruta del campo o franja en conflicto.
                    example: days[1].slots[0]
                  message:
                    type: string
                    description: Motivo del conflicto, en español.
                    example: La franja 14:00-18:00 del JUEVES tiene 1 visita confirmada (cita a9c1d2e3).

    ProblemInternalServerError:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
            - request_id
          properties:
            code:
              type: string
              description: Código de error estable.
              example: internal_server_error
            request_id:
              type: string
              format: uuid
              description: |
                Identificador de correlación. El cliente debe reportarlo para
                que el equipo pueda rastrear la petición en los logs. No se
                expone detalle interno de la excepción.
