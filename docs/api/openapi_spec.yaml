      operationId: removeFavorite
      summary: Quitar una propiedad de favoritos
      description: |
        Elimina el inmueble de la lista del usuario autenticado.

        ### Idempotente

        Devuelve `204` tanto si lo quitaba como si no estaba en la lista. Un
        `DELETE` debe poder repetirse sin efectos, y con el botón de corazón de
        `PropertyCard` un doble clic es el caso normal, no la excepción: si
        devolviera `404`, el frontend tendría que traducir ese `404` a "listo"
        para no enseñar un error al usuario que ya completó la operación.

        Por eso el `404` de este endpoint es **solo** del inmueble: si el
        `property_id` no corresponde a nada existente, ahí sí hay `404`. Si
        el inmueble existe y no estaba en la lista, la operación se considera
        cumplida.

        No devuelve cuerpo. El `204` no lleva `Set-Cookie` ni toca la sesión.
      responses:
