  /api/v1/clients/{id}/notes/{note_id}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/ClientNoteId'
    delete:
      tags:
        - Clientes
      operationId: deleteClientNote
      summary: Eliminar una observación de atención
      description: |
        Elimina una observación de atención del cliente (RF-CRM-04). La
        operación es una **eliminación lógica** (`deleted_at`), de modo que el
        registro se conserva para auditoría pero deja de aparecer en
        `GET /api/v1/clients/{id}/notes`.

        ### Autorización por autoría

        | Rol | Puede eliminar |
        |---|---|
        | `ADMINISTRADOR` | Cualquier nota visible del cliente |
        | `AGENTE` autor | La nota que él mismo escribió |
        | `AGENTE` no autor | No: `403 forbidden` |
        | `CLIENTE` | No: `403 forbidden` |

        Un agente asignado al cliente puede **leer** todas las notas, pero solo
        puede borrar las propias. La distinción importa porque la nota registra
        una opinión comercial y su autoría no debe reescribirse.

        ### Idempotencia

        Repetir el `DELETE` de una nota ya eliminada devuelve `204` sin efectos
        adicionales, para que un reintento de red no se traduzca en un error. Un
        `404` significa que la nota nunca existió, que pertenece a otro cliente o
        que el cliente no es visible para el agente autenticado; los tres casos
        se responden igual para no revelar recursos ajenos.
      responses:
        '204':
          description: Observación eliminada, o ya estaba eliminada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            El token es válido pero el usuario no es el autor de la nota ni un
            administrador. La autoría se evalúa después de comprobar que la nota
            es visible para el agente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              example:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: Solo el agente autor de la nota o un administrador pueden eliminarla.
                instance: /api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/notes/5e6f7081-4d5e-6f70-9a01-444444444444
                code: forbidden
        '404':
          description: |
            La nota no existe, pertenece a otro cliente, o el cliente no es
            visible para el agente autenticado. Un `note_id` con formato inválido
            también responde `404`, igual que en `DELETE /favorites/{property_id}/`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemNotFound'
              example:
                type: https://housebroker.pe/errors/resource-not-found
                title: Recurso no encontrado
                status: 404
                detail: La observación no existe o no pertenece al cliente indicado.
                instance: /api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/notes/5e6f7081-4d5e-6f70-9a01-444444444444
                code: resource_not_found
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido por `POST /api/v1/auth/login` y enviado como
        `Authorization: Bearer <token>`. Cubre los tres roles del MVP:
        `CLIENTE`, `AGENTE` y `ADMINISTRADOR`.

        El cliente adjunta el token en `frontend/src/services/axios.ts` leyendo
        `localStorage.hb_token`.

    refreshCookie:
        type: apiKey
        in: cookie
        name: hb_refresh_token
        description: |
          Refresh token en cookie `HttpOnly`, que es el único mecanismo con el que
          `POST /api/v1/auth/refresh` valida la sesión. El navegador la adjunta
          solo, sin que el código del cliente tenga que leerla.

          Atributos que debe fijar el backend:

          | Atributo | Valor | Motivo |
          |---|---|---|
          | `HttpOnly` | presente | Impide que `document.cookie` lo lea, que es el impacto de XSS |
          | `Secure` | presente | Solo viaja por HTTPS |
          | `SameSite` | `Strict` | Corta el envío en navegaciones originadas fuera del sitio |
          | `Path` | `/api/v1/auth` | Limita el envío a los endpoints que lo necesitan |
          | `Max-Age` | igual a `REFRESH_LIFETIME` | La sesión expira sola |

          Al no ser accesible desde JavaScript, este token **no habilita CSRF por
          sí solo** en el resto de la API: los endpoints que solo aceptan
          `Authorization: Bearer` siguen siendo inmunes porque el navegador no
          adjunta cabeceras personalizadas en un envío automático. Aun así,
          `POST /api/v1/auth/login` y `POST /api/v1/auth/refresh` sí modifican el
          estado de la sesión y deben validar un token CSRF de doble envío.

  responses:
    Unauthorized:
      description: Token ausente, vencido o con firma inválida
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemUnauthorized'
          example:
            type: https://housebroker.pe/errors/unauthorized
            title: No autenticado
            status: 401
            detail: Falta el encabezado 'Authorization' con un token Bearer válido.
            instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
            code: unauthorized
    Forbidden:
      description: |
        El token es válido pero el usuario no tiene permiso sobre el recurso.
        Ocurre cuando un `CLIENTE` intenta modificar el estado o los horarios,
        o cuando un `AGENTE` que no está asignado al inmueble intenta hacerlo.
        `ADMINISTRADOR` tiene acceso directo a cualquier inmueble.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemForbidden'
          examples:
            rolInsuficiente:
              summary: El rol del usuario no permite la operación
              value:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: Solo los roles AGENTE y ADMINISTRADOR pueden actualizar el estado de una propiedad.
                instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                code: forbidden
                required_roles:
                  - AGENTE
                  - ADMINISTRADOR
            agenteNoAsignado:
              summary: El agente no está asignado al inmueble
              value:
                type: https://housebroker.pe/errors/forbidden
                title: Sin permisos sobre el recurso
                status: 403
                detail: Solo el agente asignado a este inmueble o un administrador pueden modificar sus horarios.
                instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/status
                code: forbidden
                required_roles:
                  - AGENTE
    InternalServerError:
      description: Error interno del servidor
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemInternalServerError'
          example:
            type: https://housebroker.pe/errors/internal-server-error
            title: Error interno del servidor
            status: 500
            detail: No fue posible completar la operación solicitada.
            instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/schedules
            code: internal_server_error
            request_id: 8b1a0f5c-2d3e-4a5b-9c7d-0e1f2a3b4c5d

  parameters:
    PropertyId:
      name: id
      in: path
      required: true
      description: Identificador único del inmueble.
      schema:
        type: string
        format: uuid

    FavoritePropertyId:
      name: property_id
      in: path
      required: true
      description: |
        Identificador del inmueble. Se llama así, y no `id` como en
        `/properties/{id}`, porque en esta ruta queda claro a quién pertenece
        el recurso: el favorito del usuario.
      schema:
        type: string
        format: uuid
      example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111

    MinPrice:
      name: minPrice
      in: query
      required: false
      description: |
        Precio mínimo del inmueble, en la moneda de `price`. El extremo es
        **inclusivo**: `minPrice=150000` incluye el inmueble de 150000.0.
      schema:
        type: number
        format: double
        minimum: 0.0001
      example: 150000.0
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      description: |
        Precio máximo del inmueble, en la moneda de `price`. El extremo es
        **inclusivo**: `maxPrice=150000` incluye el inmueble de 150000.0.
      schema:
        type: number
        format: double
        minimum: 0.0001
      example: 450000.0
    PropertyTypeFilter:
      name: propertyType
      in: query
      required: false
      description: |
        Tipo de inmueble. Acepta **uno o varios valores** del enum `PropertyType`;
        varios valores actúa como un OR dentro de este filtro
        (`?propertyType=CASA&propertyType=DEPARTAMENTO`).

        Repetir el parámetro es la única forma soportada de combinar valores: no
        se acepta una lista separada por comas. Un valor fuera del enum produce
        `400`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PropertyType'
      style: form
      explode: true
      example:
        - CASA
        - DEPARTAMENTO
    UbigeoFilter:
      name: ubigeo
      in: query
      required: false
      description: |
        Código INEI de 6 dígitos del distrito. Acepta **uno o varios valores**
        con la misma semántica OR que `propertyType`
        (`?ubigeo=150131&ubigeo=150143`).

        Los códigos válidos provienen del catálogo de distritos de Lima
        Metropolitana. Un código mal formado (no numérico o de longitud distinta
        a 6) produce `400`.
      schema:
        type: array
        items:
          type: string
          pattern: '^[0-9]{6}$'
      style: form
      explode: true
      example:
        - '150131'
        - '150143'
    Search:
      name: search
      in: query
      required: false
      description: |
        Búsqueda de texto libre sobre `title` y `address`. La comparación es
        **case-insensitive** y sin distinción de acentos, de modo que
        `search=depto` encuentra "Departamento..." y `search=MIRAFLORES`
        encuentra "Miraflores".

        Los espacios iniciales, finales y dobles se colapsan antes de comparar.
        Se exige un mínimo de 2 caracteres para acotar el costo de la búsqueda;
        un texto más corto produce `400`.
      schema:
        type: string
        minLength: 2
        maxLength: 120
      example: departamento miraflores

    Page:
      name: page
      in: query
      required: false
      description: Número de página solicitada, empezando en 1.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      example: 1
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Cantidad máxima de elementos por página. Si se solicita un valor
        mayor a 100, el servidor lo ajusta a 100 en lugar de devolver un error.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 12
      example: 12
    XRequestIdParam:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Identificador de correlación opcional para trazar la petición. Si el
        cliente lo envía, el servidor lo devuelve en la respuesta.
      schema:
        type: string
        format: uuid
      example: 8b1a0f5c-2d3e-4a5b-9c7d-0e1f2a3b4c5d
    AvailabilityDate:
      name: date
      in: query
      required: true
      description: |
        Fecha concreta de la que se quiere la disponibilidad, en formato ISO
        8601 (`YYYY-MM-DD`) y timezone `America/Lima`.

        El valor se interpreta como **día local de Lima**, no como instante
        UTC: `2026-10-08` son las visitas del jueves 8 en el horario peruano,
        aunque el servidor construya los instantes en UTC.

        La fecha va de hoy a 60 días vista adelante. Formato incorrecto, fecha
        pasada o fecha fuera del horizonte producen `400`.
      schema:
        type: string
        format: date
      example: '2026-10-08'

    AppointmentId:
      name: id
      in: path
      required: true
      description: Identificador único de la cita.
      schema:
        type: string
        format: uuid
      example: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
    AppointmentStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Estado de cita. Acepta **uno o varios valores** del enum
        `AppointmentStatus`; varios valores actúa como un OR dentro de este
        filtro (`?status=PENDING&status=CONFIRMED`).

        Repetir el parámetro es la única forma soportada de combinar valores: no
        se acepta una lista separada por comas, igual que en `propertyType`. Un
        valor fuera del enum produce `400`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AppointmentStatus'
      style: form
      explode: true
      example:
        - PENDING
        - CONFIRMED
    AppointmentRoleFilter:
      name: role
      in: query
      required: false
      description: |
        Perspectiva desde la que se consulta la agenda. Reutiliza el enum
        `UserRole`, de modo que el contrato no duplica la lista de roles:

        - `CLIENTE`: citas en las que el usuario actúa como cliente.
        - `AGENTE`: citas asignadas al usuario como agente.
        - `ADMINISTRADOR`: todas las citas de la plataforma.

        Si se omite, se aplica el rol del usuario autenticado. Pedir una
        perspectiva que el rol del usuario no cubre produce `403`.
      schema:
        $ref: '#/components/schemas/UserRole'
      example: AGENTE
    AppointmentDateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Fecha mínima de la visita, en formato ISO 8601 (`YYYY-MM-DD`) y
        timezone `America/Lima`. El extremo es **inclusivo**: `dateFrom=2026-10-08`
        incluye las citas agendadas ese día. Un formato inválido produce `400`.
      schema:
        type: string
        format: date
      example: '2026-10-01'
    AppointmentDateTo:
      name: dateTo
      in: query
      required: false
      description: |
        Fecha máxima de la visita, en formato ISO 8601 (`YYYY-MM-DD`) y
        timezone `America/Lima`. El extremo es **inclusivo**. No puede ser
        anterior a `dateFrom`, lo que produce `400` con `invalid_filter_range`.
      schema:
        type: string
        format: date
      example: '2026-10-31'

    ClientId:
      name: id
      in: path
      required: true
      description: |
        Identificador del cliente. Debe corresponder a un usuario con rol
        `CLIENTE`. Se serializa como texto, igual que `AppointmentPersonRef.id`.
      schema:
        type: string
        format: uuid
      example: c3d4e5f6-2b3c-4d5e-9f70-222222222222

    ClientNoteId:
      name: note_id
      in: path
      required: true
      description: |
        Identificador de la observación de atención. Se llama `note_id` y no
        `id` porque la ruta ya usa `id` para el cliente.
      schema:
        type: string
        format: uuid
      example: 5e6f7081-4d5e-6f70-9a01-444444444444

    ClientHistoryTypeFilter:
      name: type
      in: query
      required: false
      description: |
        Tipo de entrada del historial. Acepta uno o varios valores del enum
        `ClientHistoryType`; varios valores actúan como un OR dentro de este
        filtro (`?type=APPOINTMENT&type=STATUS_CHANGE`). Repetir el parámetro
        es la única forma soportada de combinar valores: no se acepta una lista
        separada por comas. Un valor fuera del enum produce `400`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ClientHistoryType'
      style: form
      explode: true
      example:
        - APPOINTMENT
        - STATUS_CHANGE

    ClientHistoryDateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Fecha mínima de la entrada del historial, en formato ISO 8601
        (`YYYY-MM-DD`) y timezone `America/Lima`. Filtra `occurred_at`, no
        `scheduled_at`, y el extremo es **inclusivo**. Un formato inválido
        produce `400`.
      schema:
        type: string
        format: date
      example: '2026-10-01'

    ClientHistoryDateTo:
      name: dateTo
      in: query
      required: false
      description: |
        Fecha máxima de la entrada del historial, en formato ISO 8601
        (`YYYY-MM-DD`) y timezone `America/Lima`. Filtra `occurred_at` y el
        extremo es **inclusivo**. No puede ser anterior a `dateFrom`, lo que
        produce `400` con `invalid_filter_range`.
      schema:
        type: string
        format: date
      example: '2026-10-31'

  headers:
    XRequestId:
      description: Identificador de correlación devuelto para trazar la petición.
      schema:
        type: string
        format: uuid

  schemas:
    Property:
      type: object
      description: Representación de un inmueble del catálogo.
      required:
        - id
        - title
        - price
        - moneda
        - mode
        - address
        - property_type
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único del inmueble.
          example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
        title:
          type: string
          minLength: 1
          description: Título comercial del anuncio.
          example: Departamento amoblado en Miraflores
        price:
          type: number
          format: double
          minimum: 0.0001
          description: Monto del precio en la moneda indicada por `moneda`. Siempre mayor que 0.
          example: 150000.0
        moneda:
          $ref: '#/components/schemas/Moneda'
        mode:
          $ref: '#/components/schemas/TransactionMode'
        address:
          type: string
          minLength: 1
          description: Dirección completa dentro de Lima Metropolitana.
          example: Av. Larco 456, Miraflores
        property_type:
          $ref: '#/components/schemas/PropertyType'
        is_active:
          type: boolean
          description: |
            Indica si el inmueble está visible en el catálogo. Se desactiva
            mediante eliminación lógica (`DELETE`).
          example: true
        is_favorite:
          type: boolean
          description: |
            Indica si **el usuario de la petición** guardó este inmueble en
            favoritos. Es lo que permite pintar el corazón de `PropertyCard` sin
            una llamada por inmueble.

            Depende del access token, así que el mismo catálogo devuelve
            valores distintos según quién pregunte. Todas las lecturas de este
            contrato exigen `bearerAuth` por el `security` global, así que el
            campo siempre se puede calcular; si algún día publica el
            catálogo sin token, tendría que omitirlo o mandarlo `false`.
          example: true
        created_at:
          type: string
          format: date-time
          description: Fecha y hora de registro del inmueble en formato ISO 8601.
          example: '2026-09-07T10:00:00Z'
        area_total:
          type: number
          format: double
          minimum: 0
          description: Área total del inmueble en metros cuadrados.
          example: 85.5
        area_construida:
          type: number
          format: double
          minimum: 0
          description: Área construida en metros cuadrados.
          example: 78.0
        dormitorios:
          type: integer
          minimum: 0
          description: Cantidad de dormitorios.
          example: 3
        banos:
          type: integer
          minimum: 0
          description: Cantidad de baños.
          example: 2
        estacionamientos:
          type: integer
          minimum: 0
          description: Cantidad de estacionamientos.
          example: 1
        link_galeria:
          type: string
          format: uri
          description: Enlace externo a la galería de fotografías.
          example: https://galeria.housebroker.pe/departamento-miraflores-01
        link_planos:
          type: string
          format: uri
          description: Enlace externo a los planos del inmueble.
          example: https://planos.housebroker.pe/departamento-miraflores-01.pdf
        negociable:
          type: boolean
          description: Indica si el precio admite negociación.
          example: true
        destacado:
          type: boolean
          description: Indica si el anuncio se destaca en el catálogo.
          example: false
        mantenimiento:
          type: number
          format: double
          minimum: 0
          description: Costo mensual de mantenimiento, en la moneda de `moneda`.
          example: 850.0

    PropertyInput:
      type: object
      description: Cuerpo de entrada para crear o actualizar una propiedad.
      required:
        - title
        - price
        - mode
        - address
        - property_type
      properties:
        title:
          type: string
          minLength: 1
          description: Título comercial del anuncio.
          example: Departamento amoblado en Miraflores
        price:
          type: number
          format: double
          minimum: 0.0001
          description: Monto del precio en la moneda indicada por `moneda`. Siempre mayor que 0.
          example: 150000.0
        moneda:
          allOf:
            - $ref: '#/components/schemas/Moneda'
          description: |
            Moneda del precio. Si se omite, el servidor assume `PEN`.
          default: PEN
        mode:
          $ref: '#/components/schemas/TransactionMode'
        address:
          type: string
          minLength: 1
          description: Dirección completa dentro de Lima Metropolitana.
          example: Av. Larco 456, Miraflores
        property_type:
          $ref: '#/components/schemas/PropertyType'
        area_total:
          type: number
          format: double
          minimum: 0
          description: Área total del inmueble en metros cuadrados.
          example: 85.5
        area_construida:
          type: number
          format: double
          minimum: 0
          description: Área construida en metros cuadrados.
          example: 78.0
        dormitorios:
          type: integer
          minimum: 0
          description: Cantidad de dormitorios.
          example: 3
        banos:
          type: integer
          minimum: 0
          description: Cantidad de baños.
          example: 2
        estacionamientos:
          type: integer
          minimum: 0
          description: Cantidad de estacionamientos.
          example: 1
        link_galeria:
          type: string
          format: uri
          description: Enlace externo a la galería de fotografías.
          example: https://galeria.housebroker.pe/departamento-miraflores-01
        link_planos:
          type: string
          format: uri
          description: Enlace externo a los planos del inmueble.
          example: https://planos.housebroker.pe/departamento-miraflores-01.pdf
        negociable:
          type: boolean
          description: Indica si el precio admite negociación.
          example: true
        destacado:
          type: boolean
          description: Indica si el anuncio se destaca en el catálogo.
          example: false
        mantenimiento:
          type: number
          format: double
          minimum: 0
          description: Costo mensual de mantenimiento, en la moneda de `moneda`.
          example: 850.0

    PropertyType:
      type: string
      description: Categoría del inmueble.
      enum:
        - DEPARTAMENTO
        - CASA
        - TERRENO
        - OFICINA
      example: DEPARTAMENTO

    Moneda:
      type: string
      description: Moneda en la que se exprima el precio y el mantenimiento.
      enum:
        - PEN
        - USD
      example: PEN

    TransactionMode:
      type: string
      description: Modalidad de la operación del inmueble.
      enum:
        - VENTA
        - ALQUILER
      example: VENTA

    UserRole:
      type: string
      description: |
        Rol del usuario autenticado. Determina si puede consultar el catálogo y
        si puede modificar estado y horarios.
      enum:
        - CLIENTE
        - AGENTE
        - ADMINISTRADOR
      example: AGENTE

    PropertyStatus:
      type: string
      description: |
        Estado operativo del inmueble (RF-PROP-04). Es distinto de `is_active`:
        `is_active` decide la visibilidad en el catálogo, mientras `status`
        describe en qué etapa comercial está. Los cuatro primeros estados
        mantienen el inmueble visible; `SUSPENDIDO` lo retira del catálogo.
      enum:
        - DISPONIBLE
        - RESERVADO
        - ALQUILADO
        - VENDIDO
        - SUSPENDIDO

    PropertyStatusInput:
      type: object
      description: |
        Cuerpo del `PATCH` de estado. Solo se procesan `status` y `reason`; el
        resto de campos del inmueble no se ven afectados.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/PropertyStatus'
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: |
            Motivo del cambio, en español. Obligatorio para transiciones a
            `SUSPENDIDO`, `RESERVADO`, `ALQUILADO` y `VENDIDO` porque son
            decisiones comerciales auditables; opcional al volver a
            `DISPONIBLE`.
          example: El propietario inicio tramite de reserva con seña.
      example:
        status: RESERVADO
        reason: El propietario inicio tramite de reserva con seña.

    PropertyStatusResult:
      type: object
      description: |
        Estado vigente tras aplicar el parche, con trazabilidad del cambio.
        `status` es el estado nuevo y `previous_status` el anterior.
      required:
        - id
        - status
        - previous_status
        - is_active
        - changed_by
        - changed_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del inmueble al que se aplicó el cambio.
        status:
          $ref: '#/components/schemas/PropertyStatus'
        previous_status:
          allOf:
            - $ref: '#/components/schemas/PropertyStatus'
          description: |
            Estado antes del cambio. Permite al frontend revertir la UI cuando
            observa un fallo de red después de haber aplicado el parche
            optimista.
        is_active:
          type: boolean
          description: |
            Visibilidad resultante en el catálogo. Es `false` exactamente
            cuando `status` es `SUSPENDIDO`.
          example: true
        reason:
          type: string
          nullable: true
          description: Motivo registrado para el cambio, si se envió.
          example: El propietario inicio tramite de reserva con seña.
        changed_by:
          type: string
          format: uuid
          description: Usuario que ejecutó la transición.
        changed_at:
          type: string
          format: date-time
          description: Momento del cambio en formato ISO 8601.
          example: '2026-09-30T14:20:00Z'

    Weekday:
      type: string
      description: |
        Día de la semana. Los horarios se repiten semanalmente: un bloque de
        `LUNES` aplica a todos los lunes futuros, sin fecha concreta.
      enum:
        - LUNES
        - MARTES
        - MIERCOLES
        - JUEVES
        - VIERNES
        - SABADO
        - DOMINGO
      example: LUNES

    TimeSlotInput:
      type: object
      description: |
        Franja horaria en formato de 24 horas, con intervalo semiabierto
        `[start_time, end_time)`. El solapamiento entre dos franjas equivale a
        intersección no vacía de esos intervalos, de modo que 09:00-12:00 y
        12:00-15:00 son contiguas y válidas.
      required:
        - start_time
        - end_time
      additionalProperties: false
      properties:
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: |
            Hora de inicio en `HH:MM`. Valida tanto el formato como el rango
            00:00-23:59; un valor como `9:00 am` o `25:00` produce `400`.
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: |
            Hora de cierre en `HH:MM`, posterior a `start_time`. La duración
            resultante se valida entre 30 minutos y 8 horas.
          example: '12:00'

    WeekdayScheduleInput:
      type: object
      description: |
        Conjunto de franjas de un día concreto. Máximo 6 franjas por día.
      required:
        - weekday
        - slots
      additionalProperties: false
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        slots:
          type: array
          minItems: 1
          maxItems: 6
          description: |
            Franjas del día, ordenadas por `start_time` y sin solapamientos. Una
            lista vacía se rechaza con `400`: los días sin atención se omiten
            del cuerpo, no se declaran con `slots: []`.
          items:
            $ref: '#/components/schemas/TimeSlotInput'
      example:
        weekday: LUNES
        slots:
          - start_time: '09:00'
            end_time: '12:00'
          - start_time: '14:00'
            end_time: '18:00'

    PropertySchedulesInput:
      type: object
      description: |
        Configuración semanal completa que reemplaza a la anterior. Máximo 28
        franjas en total. Un día no incluido queda sin franjas; `days: []`
        deja el inmueble sin posibilidad de agendamiento sin desactivarlo.
      required:
        - days
      additionalProperties: false
      properties:
        days:
          type: array
          minItems: 0
          maxItems: 7
          description: |
            Días configurables. Cada día de la semana aparece **a lo sumo una
            vez**: un `weekday` repetido produce `400` en lugar de fusionar en
            silencio las listas de franjas.
          items:
            $ref: '#/components/schemas/WeekdayScheduleInput'
      example:
        days:
          - weekday: LUNES
            slots:
              - start_time: '09:00'
                end_time: '12:00'
              - start_time: '14:00'
                end_time: '18:00'
          - weekday: SABADO
            slots:
              - start_time: '10:00'
                end_time: '13:00'

    ScheduleSlot:
      type: object
      description: |
        Franja almacenada: los mismos campos de `TimeSlotInput` más su
        identidad y su estado de activación.
      required:
        - id
        - start_time
        - end_time
        - is_active
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la franja, estable entre reemplazos.
        start_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora de inicio en `HH:MM`.
          example: '09:00'
        end_time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Hora de cierre en `HH:MM`.
          example: '12:00'
        is_active:
          type: boolean
          description: |
            Indica si la franja admite visitas. Un `PUT` desactiva las franjas
            ausentes del cuerpo en lugar de borrarlas, de modo que las citas ya
            agendadas conserven su referencia.
          example: true

    WeekdaySchedule:
      type: object
      description: |
        Día con sus franjas, tal como quedan tras el reemplazo. A diferencia de
        `WeekdayScheduleInput`, admite `slots: []` y cada franja trae `id` e
        `is_active`.
      required:
        - weekday
        - slots
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        slots:
          type: array
          description: Franjas vigentes del día, ordenadas por `start_time`.
          items:
            $ref: '#/components/schemas/ScheduleSlot'

    PropertySchedules:
      type: object
      description: |
        Estado completo de la agenda semanal del inmueble. Siempre incluye los
        siete días: los que no tienen franjas vienen con `slots: []`, para que
        el frontend pueda pintar la semana completa sin tratar la ausencia como
        un día no cargado.
      required:
        - property_id
        - timezone
        - total_slots
        - days
      properties:
        property_id:
          type: string
          format: uuid
          description: Inmueble al que corresponden estas franjas.
        timezone:
          type: string
          description: |
            Zona horaria en la que se interpretan todas las horas del recurso.
            Fijada por el MVP a `America/Lima`; el frontend no debe aplicar su
            propia conversión sobre los valores `HH:MM`.
          example: America/Lima
        total_slots:
          type: integer
          format: int32
          minimum: 0
          description: Suma de franjas activas en la semana.
          example: 4
        days:
          type: array
          minItems: 7
          maxItems: 7
          description: Los siete días de la semana, en orden de lunes a domingo.
          items:
            $ref: '#/components/schemas/WeekdaySchedule'

    FavoriteInput:
      type: object
      additionalProperties: false
      required:
        - property_id
      description: |
        Cuerpo de `POST /api/v1/favorites/`. Solo necesita el inmueble: la fecha
        de guardado la asigna el backend, porque es un dato del servidor y no
        tiene sentido que el cliente pueda elegirlo.
      properties:
        property_id:
          type: string
          format: uuid
          description: |
            Identificador del inmueble a guardar, tomado de `Property.id`. Si no
            corresponde a un inmueble activo produce `404`.
          example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
      example:
        property_id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111

    Favorite:
      type: object
      additionalProperties: false
      required:
        - property
        - added_at
      description: |
        Un inmueble guardado, con la fecha en que el usuario lo guardó.

        No es un `Property` pelado: el contrato envuelve el inmueble y le añade
        `added_at`, que es dato de la relación y no del inmueble. Aplanar los
        campos dentro de `Property` haría que el mismo inmueble apareciera con
        metadatos distintos según desde dónde se leyera.
      properties:
        property:
          $ref: '#/components/schemas/Property'
        added_at:
          type: string
          format: date-time
          description: |
            Momento en que el usuario guardó el inmueble, en UTC. Es lo que
            ordena la lista de forma descendente y no cambia cuando el endpoint
            recibe un `POST` repetido.
          example: '2026-10-05T09:12:44Z'
      example:
        property:
          id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
          title: Departamento amoblado en Miraflores
          price: 150000.0
          moneda: PEN
          mode: VENTA
          address: Av. Larco 456, Miraflores
          property_type: DEPARTAMENTO
          is_active: true
          is_favorite: true
          created_at: '2026-09-07T10:00:00Z'
        added_at: '2026-10-05T09:12:44Z'

    PaginatedFavorites:
      type: object
      description: Envoltorio paginado de la lista de favoritos del usuario.
      required:
        - count
        - next
        - previous
        - results
      additionalProperties: false
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: |
            Total de inmuebles guardados por este usuario, sin paginar. Es el
            número que necesita la vista "Mis Favoritos" para el contador.
          example: 2
        next:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la siguiente página, o `null` si la página
            solicitada es la última.
          example: null
        previous:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la página anterior, o `null` si la página
            solicitada es la primera.
          example: null
        results:
          type: array
          description: |
            Favoritos de la página solicitada, del más reciente al más
            antiguo.
          items:
            $ref: '#/components/schemas/Favorite'

    PaginatedProperties:
      type: object
      description: Envoltorio paginado del catálogo de propiedades.
      required:
        - count
        - next
        - previous
        - results
      additionalProperties: false
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Total de registros que cumplen el filtro, sin paginar.
          example: 25
        next:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la siguiente página, o `null` si la página
            solicitada es la última.
          example: http://localhost:8000/api/v1/properties?limit=3&page=2
        previous:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la página anterior, o `null` si la página
            solicitada es la primera.
          example: null
        results:
          type: array
          description: Propiedades correspondientes a la página solicitada.
          items:
            $ref: '#/components/schemas/Property'

    AvailableSlot:
      type: object
      description: |
        Instante concreto disponible para agendar, ya materializado sobre una
        fecha. A diferencia de `ScheduleSlot`, que es una franja semanal
        recurrente en `HH:MM`, aquí las horas son fechas completas en UTC,
        porque una disponibilidad solo tiene sentido en un día determinado.
      required:
        - start_at
        - end_at
        - duration_minutes
      properties:
        start_at:
          type: string
          format: date-time
          description: |
            Inicio de la visita en UTC. Es el valor que el cliente envía como
            `scheduled_at` al reservar; debe coincidir exactamente.
          example: '2026-10-08T14:00:00Z'
        end_at:
          type: string
          format: date-time
          description: |
            Fin de la visita en UTC. Intervalo semiabierto `[start_at,
            end_at)`, igual que `ScheduleSlot`, para que dos visitas contiguas
            no se consideren solapadas.
          example: '2026-10-08T15:00:00Z'
        duration_minutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 480
          description: |
            Duración en minutos. Se deriva de `end_time - start_time` de la
            franja configurada; el cliente no puede elegirla.
          example: 60

    AvailableSlots:
      type: object
      description: |
        Disponibilidad de un inmueble en una fecha concreta. Es un recurso
        **calculado**: no se persiste y puede quedar obsoleto entre la consulta
        y la reserva, que es lo que el `409` del `POST` reflecta.
      required:
        - property_id
        - date
        - timezone
        - total_slots
        - slots
      properties:
        property_id:
          type: string
          format: uuid
          description: Inmueble consultado.
          example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
        date:
          type: string
          format: date
          description: Día consultado, tal como se recibió en `date`.
          example: '2026-10-08'
        timezone:
          type: string
          description: |
            Zona horaria en la que se interpretó `date` y en la que se
            configuraron las franjas del inmueble. Coincide con el `timezone` de
            `GET /api/v1/properties/{id}/schedules`.
          example: America/Lima
        total_slots:
          type: integer
          format: int32
          minimum: 0
          description: |
            Número de horarios devueltos. Es redundante con `slots.length` a
            propósito: el frontend lo usa para pintar un contador ("3 horarios")
            sin recorrer el arreglo, y la aserción sirve para detectar que la
            respuesta llegó truncada.
          example: 2
        slots:
          type: array
          description: |
            Horarios libres de la fecha, en orden ascendente de `start_at`. Es
            `[]` cuando el día no tiene franjas, tiene todas desactivadas o ya
            se agotaron.
          items:
            $ref: '#/components/schemas/AvailableSlot'
          example:
            - start_at: '2026-10-08T14:00:00Z'
              end_at: '2026-10-08T15:00:00Z'
              duration_minutes: 60

    AppointmentCreateInput:
      type: object
      description: |
        Cuerpo del alta de cita. `scheduled_at` debe ser un `start_at` devuelto
        por `GET /api/v1/properties/{id}/available-slots` para la misma
        propiedad; el servidor no ajusta la hora ni reserva un hueco
        aproximado.
      required:
        - property_id
        - scheduled_at
      additionalProperties: false
      properties:
        property_id:
          type: string
          format: uuid
          description: Inmueble que se quiere visitar.
          example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
        scheduled_at:
          type: string
          format: date-time
          description: |
            Instante de la visita en UTC. Debe coincidir exactamente con un
            horario disponible; cualquier otro valor produce `400`.
          example: '2026-10-08T16:00:00Z'
        client_id:
          type: string
          format: uuid
          description: |
            Cliente para el que se registra la visita. **Solo lo envía un
            `AGENTE` o un `ADMINISTRADOR`**, para agendar en nombre de alguien
            que se presenta en oficina. Un `CLIENTE` que incluya este campo
            recibe `403`: su identificador se toma siempre del token.
          example: c3d4e5f6-2b3c-4d5e-9f70-222222222222
      example:
        property_id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
        scheduled_at: '2026-10-08T16:00:00Z'

    RegisterInput:
      type: object
      description: |
        Cuerpo del registro público. `additionalProperties: false` hace que un
        cliente que invente campos reciba `400` en lugar de que se ignoren en
        silencio.
      required:
        - email
        - password
        - full_name
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Correo de la cuenta. Es el identificador de inicio de sesión, por
            lo que debe ser único. El backend lo normaliza a minúsculas antes
            de comparar, de modo que `Maria@correo.com` y `maria@correo.com` son
            la misma cuenta.
          example: maria.quispe@correo.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: |
            Contraseña en texto plano, que el backend cifra con Bcrypt antes de
            almacenarla. `format: password` marca el campo para que las
            herramientas de documentación lo oculten, y `writeOnly` impide que
            un generador de clientes lo incluya en las respuestas.

            Cumple al menos 10 caracteres, una mayúscula, una minúscula y un
            dígito. El incumplimiento produce `400` con `weak_password`.
          example: ClaveSegura2026
        full_name:
          type: string
          minLength: 2
          maxLength: 120
          description: Nombres y apellidos del usuario.
          example: Maria Fernanda Quispe
        phone:
          type: string
          minLength: 9
          maxLength: 20
          description: |
            Teléfono de contacto, opcional en el registro y editable después.
            Es el canal de avisos de cita además del correo.
          example: '+51 987 654 321'
        role:
          type: string
          description: |
            Rol solicitado. **Solo se admite `CLIENTE`.** Las cuentas de `AGENTE`
            y `ADMINISTRADOR` las crea un administrador, así que un registro
            público que aceptara esos valores permitiría escalada de
            privilegios. Enviar cualquiera de los dos produce `400` con
            `role_not_assignable`.
          enum:
            - CLIENTE
          default: CLIENTE
          example: CLIENTE
      example:
        email: maria.quispe@correo.com
        password: ClaveSegura2026
        full_name: Maria Fernanda Quispe
        phone: '+51 987 654 321'

    LoginInput:
      type: object
      description: Cuerpo del inicio de sesión.
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Correo con el que se registró la cuenta. La comparación no distingue
            mayúsculas ni acentos.
          example: maria.quispe@correo.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: Contraseña de la cuenta.
          example: ClaveSegura2026
      example:
        email: maria.quispe@correo.com
        password: ClaveSegura2026

    AuthUser:
      type: object
      description: |
        Usuario autenticado. Es la representación pública: **no incluye
        `password` ni `is_staff`**, porque el frontend solo necesita identificar
        a la persona y conocer su rol para decidir qué interfaz mostrar.
      required:
        - id
        - email
        - full_name
        - role
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del usuario.
          example: c3d4e5f6-2b3c-4d5e-9f70-222222222222
        email:
          type: string
          format: email
          description: Correo de la cuenta.
          example: maria.quispe@correo.com
        full_name:
          type: string
          description: Nombres y apellidos.
          example: Maria Fernanda Quispe
        phone:
          type: string
          nullable: true
          description: Teléfono de contacto, si se registró.
          example: '+51 987 654 321'
        role:
          $ref: '#/components/schemas/UserRole'
        is_active:
          type: boolean
          description: |
            Cuenta habilitada. Una cuenta desactivada no puede iniciar sesión
            (`403` `account_disabled`) y sus tokens dejan de aceptarse.
          example: true
        created_at:
          type: string
          format: date-time
          description: Momento de alta de la cuenta.
          example: '2026-10-05T09:12:44Z'

    TokenPair:
      type: object
      description: |
        Credenciales de sesión. Deliberadamente **no** incluye el refresh token:
        ese viaja en la cookie `HttpOnly` descrita en
        `securitySchemes.refreshCookie`. Si el refresh estuviera en el cuerpo,
        cualquier XSS podría leerlo y robar la sesión completa, que es
        justamente lo que la cookie evita.
      required:
        - access
        - token_type
        - expires_in
        - user
      properties:
        access:
          type: string
          description: |
            Access token JWT. El cliente lo mantiene **solo en memoria** y lo
            envía en `Authorization: Bearer <access>` en cada petición.

            Su payload lleva estos claims, y es de ahí de donde el backend toma
            el rol para autorizar, no de una consulta a la base de datos:

            | Claim | Contenido | Uso |
            |---|---|---|
            | `sub` | UUID del usuario | Identidad del titular |
            | `email` | Correo normalizado a minúsculas | Trazabilidad |
            | `role` | `CLIENTE`, `AGENTE` o `ADMINISTRADOR` | **Autorización (RBAC)** |
            | `token_type` | `access` | Distinguirlo del refresh ante una confusión de tokens |
            | `jti` | Identificador único del token | Revocación individual |
            | `iat` / `exp` | Emisión y expiración, en Unix epoch | Validación de vigencia |

            La contrapartida de llevar el rol en el token es que un cambio de rol
            no surte efecto hasta que el access expira, salvo que se revoque por
            `jti`.
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjM2Q0ZTVmNiJ9
        token_type:
          type: string
          description: |
            Tipo de credencial de la cabecera `Authorization`. Siempre `Bearer`,
            por RFC 6750.
          enum:
            - Bearer
          example: Bearer
        expires_in:
          type: integer
          format: int32
          minimum: 1
          description: |
            Segundos de vigencia del access token. Permite al frontend renovar
            proactivamente en lugar de esperar un `401`.
          example: 1800
        user:
          $ref: '#/components/schemas/AuthUser'

    AppointmentStatus:
      type: string
      description: |
        Estado de la cita en la agenda del agente (RF-CRM-02). Describe en qué
        punto del ciclo de vida de la visita está la cita, no el estado
        comercial del inmueble, que es responsabilidad de `PropertyStatus`.

        Los tres últimos estados son terminales: no admiten transición de
        salida.
      enum:
        - PENDING
        - CONFIRMED
        - RESCHEDULED
        - COMPLETED
        - CANCELLED
        - NO_SHOW
      example: CONFIRMED

    AppointmentPropertyRef:
      type: object
      description: |
        Referencia ligera al inmueble objeto de la visita. No replica el
        esquema `Property` completo: la ficha del inmueble se resuelve con
        `GET /api/v1/properties/{id}`, y el listado de citas solo necesita
        identificar y localizar el inmueble.
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del inmueble.
          example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
        title:
          type: string
          description: Título del anuncio.
          example: Departamento amoblado en Miraflores
        district:
          type: string
          nullable: true
          description: Distrito del inmueble.
          example: Miraflores
        address:
          type: string
          description: Dirección del inmueble.
          example: Av. Larco 456, Miraflores

    AppointmentPersonRef:
      type: object
      description: |
        Referencia ligera a un participante de la cita, reutilizada tanto para
        el cliente como para el agente. El perfil completo se resuelve con
        `GET /api/v1/auth/me` y los datos de contacto del cliente con la ficha
        de CRM (HU-CRM-03).
      required:
        - id
        - full_name
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del usuario.
          example: c3d4e5f6-2b3c-4d5e-9f70-222222222222
        full_name:
          type: string
          description: Nombre completo del usuario.
          example: Maria Fernanda Quispe
        email:
          type: string
          format: email
          nullable: true
          description: |
            Correo del usuario. Es la vía por la que se envían los avisos de
            confirmación, reprogramación y cancelación (RF-SEC-05).
          example: maria.quispe@correo.com
        phone:
          type: string
          nullable: true
          description: Teléfono de contacto.
          example: '+51 987 654 321'

    Appointment:
      type: object
      description: |
        Cita de visita a un inmueble. El modelo se crea en
        `TASK-ARC-CRM-01` (Sprint 4); esta tarea define su representación de
        lectura y la actualización de estado.
      required:
        - id
        - status
        - scheduled_at
        - property
        - client
        - agent
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la cita.
          example: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        scheduled_at:
          type: string
          format: date-time
          description: |
            Fecha y hora de la visita, en UTC con sufijo `Z`. Es el valor que
            filtran `dateFrom` y `dateTo`, y el que se compara contra los
            `ScheduleSlot` de la propiedad al agendar o reprogramar.
          example: '2026-10-08T15:00:00Z'
        duration_minutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 480
          default: 45
          description: |
            Duración de la visita en minutos. Deriva del `ScheduleSlot`
            reservado y determina la ventana `[scheduled_at,
            scheduled_at + duration_minutes)` que se usa para detectar
            solapamientos entre citas del mismo agente.
          example: 45
        reason:
          type: string
          nullable: true
          description: |
            Último motivo registrado por el agente al cancelar, reprogramar o
            registrar una inasistencia. Es `null` mientras la cita no tenga
            ninguno.
          example: El propietario no se encuentra disponible en ese horario.
        property:
          $ref: '#/components/schemas/AppointmentPropertyRef'
        client:
          $ref: '#/components/schemas/AppointmentPersonRef'
        agent:
          $ref: '#/components/schemas/AppointmentPersonRef'
        created_at:
          type: string
          format: date-time
          description: Momento de creación del registro.
          example: '2026-10-05T09:12:44Z'
        updated_at:
          type: string
          format: date-time
          description: |
            Momento de la última modificación, incluido el último cambio de
            estado. Permite al frontend detectar que la cita cambió mientras
            el usuario tenía el detalle abierto.
          example: '2026-10-06T14:03:21Z'

    AppointmentStatusInput:
      type: object
      description: |
        Cuerpo del `PATCH` de estado. Solo se procesan `status`, `scheduled_at`
        y `reason`; el resto de campos de la cita no se ven afectados.

        `PENDING` se excluye del conjunto de destinos a propósito: una cita
        nace en `PENDING` al ser solicitada y ninguna transición válida
        devuelve el estado a ese valor.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          description: Estado de destino de la cita.
          enum:
            - CONFIRMED
            - RESCHEDULED
            - COMPLETED
            - CANCELLED
            - NO_SHOW
          example: CONFIRMED
        scheduled_at:
          type: string
          format: date-time
          description: |
            Nuevo horario de la visita. **Obligatorio** cuando `status` es
            `RESCHEDULED` y **prohibido** en cualquier otra transición, para
            que reprogramar y mover una cita sin cambiar su estado no se
            confundan.
          example: '2026-10-15T17:00:00Z'
        reason:
          type: string
          minLength: 5
          maxLength: 500
          description: |
            Motivo del cambio, en español. Obligatorio para `CANCELLED` y
            `RESCHEDULED` porque ambas decisiones se comunican al cliente por
            correo; recomendado para `NO_SHOW`. Opcional al confirmar o
            completar.
          example: El propietario no se encuentra disponible en ese horario.
      example:
        status: RESCHEDULED
        scheduled_at: '2026-10-15T17:00:00Z'
        reason: El propietario no se encuentra disponible en ese horario.

    AppointmentStatusResult:
      type: object
      description: |
        Estado vigente tras aplicar el parche, con trazabilidad del cambio.
        Sigue el mismo patrón que `PropertyStatusResult`: `status` es el valor
        nuevo y `previous_status` el anterior, de modo que el cliente pueda
        revertir su actualización optimista ante un fallo de red.
      required:
        - id
        - status
        - previous_status
        - scheduled_at
        - previous_scheduled_at
        - changed_by
        - changed_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la cita modificada.
          example: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        previous_status:
          allOf:
            - $ref: '#/components/schemas/AppointmentStatus'
          description: |
            Estado antes del cambio. Permite al frontend revertir la UI cuando
            observa un fallo de red después de haber aplicado el parche
            optimista.
        scheduled_at:
          type: string
          format: date-time
          description: |
            Horario vigente tras el cambio. Solo difiere del anterior cuando la
            transición fue una reprogramación.
          example: '2026-10-15T17:00:00Z'
        previous_scheduled_at:
          type: string
          format: date-time
          description: |
            Horario antes del cambio. Se devuelve siempre, incluso si no cambió,
            para que el cliente tenga el valor completo con el que revertir.
          example: '2026-10-08T15:00:00Z'
        reason:
          type: string
          nullable: true
          description: Motivo registrado para el cambio, si se envió.
          example: El propietario no se encuentra disponible en ese horario.
        changed_by:
          type: string
          format: uuid
          description: Usuario que ejecutó la transición.
        changed_at:
          type: string
          format: date-time
          description: Momento del cambio en formato ISO 8601.
          example: '2026-10-07T11:40:00Z'

    PaginatedAppointments:
      type: object
      description: |
        Envoltorio paginado de la agenda de citas. replica la forma de
        `PaginatedProperties` para que el cliente reutilice un único
        envoltorio de paginación contra ambos listados.
      required:
        - count
        - next
        - previous
        - results
      additionalProperties: false
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Total de citas que cumplen los filtros, sin paginar.
          example: 12
        next:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la siguiente página, arrastrando los filtros
            activos, o `null` si la página solicitada es la última.
          example: http://localhost:8000/api/v1/appointments?limit=3&page=2
        previous:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la página anterior, o `null` si la página
            solicitada es la primera.
          example: null
        results:
          type: array
          description: Citas correspondientes a la pǭgina solicitada.
          items:
            $ref: '#/components/schemas/Appointment'

    ClientBudget:
      type: object
      description: |
        Presupuesto declarado por el cliente para la búsqueda. Los tres campos
        pueden faltar por separado; `min` nunca es mayor que `max` cuando ambos
        existen, porque el backend valida la coherencia antes de responder.
      additionalProperties: false
      properties:
        min:
          type: number
          format: double
          minimum: 0.0001
          description: Piso del presupuesto, en la moneda indicada.
          example: 1800
        max:
          type: number
          format: double
          minimum: 0.0001
          description: Techo del presupuesto, en la moneda indicada.
          example: 2500
        currency:
          $ref: '#/components/schemas/Moneda'

    ClientPreferences:
      type: object
      description: |
        Preferencias estructuradas captadas por el asistente virtual
        (`client_profile.preferences`, jsonb). El esquema declara las claves
        conocidas del MVP, pero mantiene `additionalProperties: true` porque la
        base no valida la forma: agregar una preferencia nueva no debe romper a
        los clientes que ya consumen el contrato.
      additionalProperties: true
      properties:
        mode:
          $ref: '#/components/schemas/TransactionMode'
        property_type:
          $ref: '#/components/schemas/PropertyType'
        districts:
          type: array
          description: Distritos mencionados por el cliente, en texto libre.
          items:
            type: string
          example:
            - Miraflores
            - San Isidro
        budget:
          $ref: '#/components/schemas/ClientBudget'
        bedrooms:
          type: integer
          format: int32
          minimum: 0
          description: Número de dormitorios deseados.
          example: 2
        bathrooms:
          type: number
          format: double
          minimum: 0
          description: Número de baños deseados. Admite medios baños.
          example: 2
        parking:
          type: boolean
          description: Indica si el cliente exige cochera.
          example: true
        accepts_pets:
          type: boolean
          description: Indica si el cliente busca un inmueble que acepte mascotas.
          example: true
        required_features:
          type: array
          description: Características adicionales mencionadas por el cliente.
          items:
            type: string
          example:
            - ascensor
            - cerca a transporte
        extracted_at:
          type: string
          format: date-time
          description: Momento en que el asistente extrajo las preferencias.
          example: '2026-10-05T09:12:44Z'
        source_message_id:
          type: string
          format: uuid
          nullable: true
          description: Mensaje del chat del que provinieron las preferencias.
          example: 8f2c1a60-1b2c-4d3e-8f5a-6b7c8d9e0f1a

    ClientProfileSummary:
      type: object
      description: |
        Resumen de actividad del cliente, calculado sobre sus citas. Los
        conteos no se suman necesariamente al total: `appointments_upcoming`
        incluye `PENDING`, `CONFIRMED` y `RESCHEDULED` con `scheduled_at`
        futuro, mientras que los demás son estados terminales.
      additionalProperties: false
      required:
        - appointments_total
        - appointments_upcoming
        - appointments_completed
        - appointments_cancelled
        - appointments_no_show
        - properties_total
        - favorite_properties_total
        - last_appointment_at
        - next_appointment_at
      properties:
        appointments_total:
          type: integer
          format: int32
          minimum: 0
          description: Total de citas registradas, en cualquier estado.
          example: 6
        appointments_upcoming:
          type: integer
          format: int32
          minimum: 0
          description: Citas no terminales cuya fecha de visita aún no pasó.
          example: 2
        appointments_completed:
          type: integer
          format: int32
          minimum: 0
          description: Citas en estado `COMPLETED`.
          example: 3
        appointments_cancelled:
          type: integer
          format: int32
          minimum: 0
          description: Citas en estado `CANCELLED`.
          example: 1
        appointments_no_show:
          type: integer
          format: int32
          minimum: 0
          description: Citas en estado `NO_SHOW`.
          example: 0
        properties_total:
          type: integer
          format: int32
          minimum: 0
          description: Inmuebles distintos asociados a las citas del cliente.
          example: 4
        favorite_properties_total:
          type: integer
          format: int32
          minimum: 0
          description: Inmuebles que el cliente marcó como favoritos.
          example: 2
        last_appointment_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de la cita más reciente ya realizada, o `null`.
          example: '2026-09-28T16:00:00Z'
        next_appointment_at:
          type: string
          format: date-time
          nullable: true
          description: Fecha de la próxima cita no terminal, o `null`.
          example: '2026-10-08T15:00:00Z'

    ClientProperty:
      type: object
      description: |
        Inmueble asociado a las citas del cliente. Es una vista derivada de
        `appointment.property`, no el esquema `Property` completo: la ficha del
        inmueble se resuelve con `GET /api/v1/properties/{id}`.
      additionalProperties: false
      required:
        - id
        - title
        - appointments_count
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del inmueble.
          example: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
        title:
          type: string
          description: Título del anuncio.
          example: Departamento amoblado en Miraflores
        district:
          type: string
          nullable: true
          description: Distrito del inmueble.
          example: Miraflores
        address:
          type: string
          description: Dirección del inmueble.
          example: Av. Larco 456, Miraflores
        price:
          type: number
          format: double
          minimum: 0.0001
          description: Precio vigente del inmueble, en su moneda.
          example: 2300.0
        currency:
          $ref: '#/components/schemas/Moneda'
        property_type:
          $ref: '#/components/schemas/PropertyType'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        is_active:
          type: boolean
          description: Indica si el inmueble sigue visible en el catálogo.
          example: true
        appointments_count:
          type: integer
          format: int32
          minimum: 0
          description: Citas del cliente asociadas a este inmueble.
          example: 2
        last_appointment_at:
          type: string
          format: date-time
          nullable: true
          description: Última cita del cliente con este inmueble.
          example: '2026-09-28T16:00:00Z'
        next_appointment_at:
          type: string
          format: date-time
          nullable: true
          description: Próxima cita no terminal del cliente con este inmueble.
          example: '2026-10-08T15:00:00Z'

    ClientProfile:
      type: object
      description: |
        Ficha CRM consolidada del cliente (HU-CRM-03). Reúne la cuenta de
        usuario, el perfil comercial (`client_profile`), las preferencias
        captadas y un resumen de las citas.

        Los campos `budget_*`, `preferred_district`, `preferences` e
        `interest_level` pueden ser `null` si el cliente aún no completó su
        perfil CRM. `document_type` y `document_number` no se exponen.
      additionalProperties: false
      required:
        - id
        - full_name
        - email
        - phone
        - is_active
        - created_at
        - updated_at
        - summary
        - associated_properties
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del usuario cliente.
          example: c3d4e5f6-2b3c-4d5e-9f70-222222222222
        full_name:
          type: string
          description: Nombre completo del cliente.
          example: Maria Fernanda Quispe
        email:
          type: string
          format: email
          nullable: true
          description: Correo de contacto.
          example: maria.quispe@correo.com
        phone:
          type: string
          nullable: true
          description: Teléfono de contacto.
          example: '+51 987 654 321'
        is_active:
          type: boolean
          description: Indica si la cuenta puede operar en la plataforma.
          example: true
        created_at:
          type: string
          format: date-time
          description: Momento de creación de la cuenta.
          example: '2026-01-12T10:15:00Z'
        updated_at:
          type: string
          format: date-time
          description: |
            Última modificación del perfil CRM. Si el cliente no tiene
            `client_profile`, refleja la última modificación de la cuenta.
          example: '2026-10-05T09:12:44Z'
        budget_min:
          type: number
          format: double
          minimum: 0.0001
          nullable: true
          description: Piso del presupuesto declarado, en `budget_currency`.
          example: 1800
        budget_max:
          type: number
          format: double
          minimum: 0.0001
          nullable: true
          description: Techo del presupuesto declarado, en `budget_currency`.
          example: 2500
        budget_currency:
          $ref: '#/components/schemas/Moneda'
        preferred_district:
          type: string
          maxLength: 100
          nullable: true
          description: |
            Distrito preferido en texto libre, tal como lo mencionó el cliente.
            No es un `ubigeo`; la resolución a código ocurre en el módulo de
            recomendaciones.
          example: Miraflores
        preferences:
          type: object
          allOf:
            - $ref: '#/components/schemas/ClientPreferences'
          nullable: true
          description: Preferencias estructuradas captadas por el asistente.
        interest_level:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
          description: |
            Nivel de interés consolidado de las visitas (1 a 5). Es un dato
            interno de seguimiento comercial; no debe usarse para scoring
            automático sin revisión de sesgo.
          example: 4
        summary:
          $ref: '#/components/schemas/ClientProfileSummary'
        associated_properties:
          type: array
          description: |
            Inmuebles asociados a las citas del cliente, ordenados por la cita
            más reciente descendente.
          items:
            $ref: '#/components/schemas/ClientProperty'

    ClientHistoryType:
      type: string
      description: |
        Tipo de entrada del historial del cliente. `APPOINTMENT` representa la
        creación de una solicitud de visita; `STATUS_CHANGE`, una transición de
        estado aceptada por la máquina de estados de citas.
      enum:
        - APPOINTMENT
        - STATUS_CHANGE
      example: STATUS_CHANGE

    ClientHistoryEntry:
      type: object
      description: |
        Entrada de la línea de tiempo del cliente. Los campos de estado y
        horario describen el hecho en el momento en que ocurrió, mientras que
        el objeto `appointment` es el estado vigente de la cita al consultar.
        El frontend debe usar `occurred_at`, `status`, `scheduled_at` y
        `reason` para pintar la línea de tiempo, y `appointment.id` para
        enlazar al detalle actualizado.

        En una entrada `APPOINTMENT`, `previous_status` y
        `previous_scheduled_at` son `null` y `status` es siempre `PENDING`.
      additionalProperties: false
      required:
        - id
        - type
        - occurred_at
        - appointment
        - status
        - scheduled_at
      properties:
        id:
          type: string
          format: uuid
          description: |
            Identificador de la entrada. Para `APPOINTMENT` coincide con el id
            de la cita; para `STATUS_CHANGE`, con el id del registro de cambio.
          example: 4d5e6f70-3c4d-5e6f-8a90-333333333333
        type:
          $ref: '#/components/schemas/ClientHistoryType'
        occurred_at:
          type: string
          format: date-time
          description: |
            Momento del hecho, en UTC con sufijo `Z`. Es el campo por el que se
            ordena y se filtra la línea de tiempo.
          example: '2026-10-06T14:03:21Z'
        appointment:
          $ref: '#/components/schemas/Appointment'
        previous_status:
          type: string
          nullable: true
          description: |
            Estado anterior a la transición; `null` en `APPOINTMENT`. Los
            valores posibles son los mismos del enum `AppointmentStatus`.
          example: PENDING
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        scheduled_at:
          type: string
          format: date-time
          description: Horario de la visita vigente en el momento del hecho.
          example: '2026-10-08T15:00:00Z'
        previous_scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Horario anterior en una reprogramación; `null` en `APPOINTMENT`.
          example: '2026-10-08T15:00:00Z'
        reason:
          type: string
          nullable: true
          description: Motivo registrado para el cambio, si se envió.
          example: El cliente confirmó la visita por teléfono.
        changed_by:
          type: object
          nullable: true
          description: |
            Usuario que ejecutó el cambio de estado; `null` en `APPOINTMENT` o
            cuando la cuenta del actor fue eliminada. Tiene la misma forma que
            `AppointmentPersonRef`.
          example:
            id: 7c4a9d21-3b6e-4f80-9a2d-5e7c1b3f8d40
            full_name: Brandy Sinche
            email: brandy.sinche@housebrokerperu.com

    PaginatedClientHistory:
      type: object
      description: |
        Envoltorio paginado de la línea de tiempo del cliente. Replica la forma
        de `PaginatedAppointments` para que el frontend reutilice un único
        envoltorio de paginación.
      additionalProperties: false
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Total de entradas que cumplen los filtros, sin paginar.
          example: 8
        next:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la siguiente página, arrastrando los filtros
            activos, o `null` si la página solicitada es la última.
          example: http://localhost:8000/api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/history?limit=3&page=2
        previous:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la página anterior, o `null` si la página
            solicitada es la primera.
          example: null
        results:
          type: array
          description: Entradas del historial correspondientes a la página.
          items:
            $ref: '#/components/schemas/ClientHistoryEntry'

    ClientNote:
      type: object
      description: |
        Observación de atención registrada por un agente sobre un cliente
        (RF-CRM-04). Es un dato interno de seguimiento comercial: no se expone
        en el catálogo ni en ningún endpoint público.

        El `author` es el usuario del access token que creó la nota, no un campo
        de la entrada. `appointment_id` enlaza la nota con la visita que la
        originó y es `null` cuando se trata de un seguimiento sin cita, como una
        llamada telefónica.
      additionalProperties: false
      required:
        - id
        - client_id
        - author
        - body
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la observación.
          example: 5e6f7081-4d5e-6f70-9a01-444444444444
        client_id:
          type: string
          format: uuid
          description: Cliente al que pertenece la observación.
          example: c3d4e5f6-2b3c-4d5e-9f70-222222222222
        author:
          $ref: '#/components/schemas/AppointmentPersonRef'
        appointment_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Cita que originó la observación, o `null` si es una nota de
            seguimiento sin visita asociada.
          example: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto de la observación.
          example: El cliente mostró interés en la vista al mar y pidió evaluar una contraoferta.
        interest_level:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          nullable: true
          description: |
            Nivel de interés observado durante la atención (1 a 5), o `null` si
            el agente no lo registró.
          example: 4
        client_showed_up:
          type: boolean
          nullable: true
          description: |
            Indica si el cliente asistió a la visita. `null` cuando la nota no
            corresponde a una visita concreta o el dato no se registró.
          example: true
        counteroffer_amount:
          type: number
          format: double
          minimum: 0.0001
          nullable: true
          description: Monto de la contraoferta del cliente, en su moneda.
          example: 2350.0
        counteroffer_currency:
          type: string
          nullable: true
          enum:
            - PEN
            - USD
          description: |
            Moneda de la contraoferta. Aparece junto a `counteroffer_amount` o
            ambos son `null`: un monto sin moneda no tiene significado. Repite
            los valores de `Moneda` porque OpenAPI 3.0 no combina `nullable`
            con un `$ref` de forma fiable.
          example: PEN
        followup_at:
          type: string
          format: date-time
          nullable: true
          description: Recordatorio de seguimiento comercial, o `null` si no se programó.
          example: '2026-10-12T15:00:00Z'
        created_at:
          type: string
          format: date-time
          description: Momento en que se registró la observación.
          example: '2026-10-08T16:30:00Z'

    ClientNoteCreateInput:
      type: object
      description: |
        Cuerpo de `POST /api/v1/clients/{id}/notes`. Solo `body` es
        obligatorio: una observación puede ser únicamente texto. El autor, el
        cliente y la fecha de creación los fija el servidor y no se aceptan en
        la entrada (`additionalProperties: false`).
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto de la observación, obligatorio.
          example: El cliente mostró interés en la vista al mar y pidió evaluar una contraoferta.
        appointment_id:
          type: string
          format: uuid
          description: |
            Cita que originó la observación. Si se envía, debe existir y
            pertenecer al cliente de la ruta; de lo contrario responde `400`
            con `invalid_appointment_reference`.
          example: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        interest_level:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Nivel de interés observado durante la atención (1 a 5).
          example: 4
        client_showed_up:
          type: boolean
          description: Indica si el cliente asistió a la visita.
          example: true
        counteroffer_amount:
          type: number
          format: double
          minimum: 0.0001
          description: |
            Monto de la contraoferta del cliente. Debe enviarse junto a
            `counteroffer_currency`; si falta uno de los dos, responde `400`
            con `invalid_counteroffer`.
          example: 2350.0
        counteroffer_currency:
          $ref: '#/components/schemas/Moneda'
        followup_at:
          type: string
          format: date-time
          description: Recordatorio de seguimiento comercial.
          example: '2026-10-12T15:00:00Z'
      example:
        body: El cliente mostró interés en la vista al mar y pidió evaluar una contraoferta.
        appointment_id: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        interest_level: 4
        client_showed_up: true
        counteroffer_amount: 2350.0
        counteroffer_currency: PEN
        followup_at: '2026-10-12T15:00:00Z'

    PaginatedClientNotes:
      type: object
      description: |
        Envoltorio paginado de las observaciones de atención del cliente.
        Replica la forma de `PaginatedClientHistory` para que el frontend
        reutilice un único envoltorio de paginación.
      additionalProperties: false
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Total de notas que cumplen la consulta, sin paginar.
          example: 2
        next:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la siguiente página, conservando la paginación de
            la consulta, o `null` si la página solicitada es la última.
          example: http://localhost:8000/api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/notes?limit=20&page=2
        previous:
          type: string
          format: uri
          nullable: true
          description: |
            URL absoluta de la página anterior, o `null` si la página
            solicitada es la primera.
          example: null
        results:
          type: array
          description: Observaciones de la página, de la más reciente a la más antigua.
          items:
            $ref: '#/components/schemas/ClientNote'

    Problem:
      type: object
      description: |
        Objeto base de error conforme a **RFC 7807** (Problem Details for
        HTTP APIs). Los campos `type`, `title`, `status` y `detail` son los
        member names definidos por el estándar; `code`, `errors` y `request_id`
        son extensiones propias de la API.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica el tipo de problema.
          example: https://housebroker.pe/errors/invalid-query-parameter
        title:
          type: string
          description: Resumen corto y estable del tipo de problema.
          example: Parámetro de consulta inválido
        status:
          type: integer
          format: int32
          description: Código de estado HTTP, replicado por comodidad del cliente.
          example: 400
        detail:
          type: string
          description: Explicación del problema en español, legible por una persona.
          example: El parámetro 'page' debe ser un entero mayor o igual a 1.
        instance:
          type: string
          format: uri-reference
          description: Ruta de la petición que originó el problema.
          example: /api/v1/properties?page=0
        code:
          type: string
          description: Código de error estable y programático.
          example: invalid_query_parameter
        request_id:
          type: string
          format: uuid
          description: Identificador de correlación para soporte y trazabilidad.

    ProblemBadRequest:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
            - errors
          properties:
            code:
              type: string
              description: |
                Código de error estable. Para la query del catálogo,
                `invalid_query_parameter` cubre el rechazo de un parámetro
                individual por tipo, formato, longitud o pertenencia a un enum;
                `invalid_filter_range` cubre la incoherencia entre `minPrice` y
                `maxPrice`, que es válida en cada parámetro por separado pero
                rechazada en conjunto.

                En el módulo CRM se suman `invalid_filter_range` para un rango
                de fechas invertido (`dateFrom` > `dateTo`),
                `invalid_appointment_transition` cuando el `status` de destino no
                es alcanzable desde el estado actual de la cita, y
                `property_not_bookable` cuando se intenta agendar una visita
                sobre una propiedad cuyo `PropertyStatus` no admite reservas.

                En el módulo de observaciones se suman `invalid_counteroffer`
                cuando `counteroffer_amount` y `counteroffer_currency` no se
                envían juntos, e `invalid_appointment_reference` cuando la cita
                indicada no existe o no pertenece al cliente.

                En el módulo de autenticación se suman `weak_password` cuando
                una clave no cumple la política de seguridad, tanto en el
                registro como al restablecer la contraseña, y
                `password_mismatch` cuando `new_password` y `re_new_password`
                no coinciden en `password-reset-confirm`.
              example: invalid_query_parameter
            errors:
              type: array
              description: |
                Detalle del error por cada parámetro o campo rechazado. La
                validación no corta en el primer fallo: la lista contiene una
                entrada por cada parámetro inválido de la misma petición, de modo
                que el frontend pueda marcar todos los controles con error a la
                vez. El orden sigue el de los parámetros declarados en la
                operación.
              items:
                type: object
                required:
                  - parameter
                  - message
                properties:
                  parameter:
                    type: string
                    description: Nombre del parámetro o campo rechazado.
                    example: page
                  message:
                    type: string
                    description: |
                      Motivo del rechazo, en español. Redactado de forma que
                      pueda mostrarse tal cual junto al control del formulario,
                      sin código ni jargon.
                    example: El valor '0' es menor que el mínimo permitido (1).

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      description: |
        Cuerpo de `POST /api/v1/auth/password-reset/`. Solo necesita el correo:
        el token se genera en el servidor y viaja por email, nunca lo elige ni lo
        recibe el cliente.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Correo al que se intenta enviar el enlace de restablecimiento. El
            backend lo normaliza a minúsculas antes de buscar la cuenta.

            Aunque no exista ninguna cuenta con ese correo, la respuesta es `202`
            con el mismo cuerpo: la diferencia se produciría dentro del backend y
            nunca sale por la API.
          example: maria.quispe@correo.com
      example:
        email: maria.quispe@correo.com

    PasswordResetRequested:
      type: object
      additionalProperties: false
      required:
        - detail
        - email_sent
      description: |
        Cuerpo de la respuesta `202` de `password-reset`.

        `email_sent` es siempre `true` y existe por una sola razón: dejar el
        contrato explícito ante el frontend de que **el valor no confirma nada**.
        Un futuro `false` sería una fuga de enumeración de cuentas, así que
        tendría que venir acompañado de un cambio de versión del contrato.
      properties:
        detail:
          type: string
          description: |
            Mensaje para mostrar al usuario, redactado de forma que sirva tanto
            si se envió el correo como si no.
          example: >-
            Si el correo corresponde a una cuenta activa, recibirás un mensaje
            con el enlace para restablecer tu clave.
        email_sent:
          type: boolean
          enum:
            - true
          description: |
            Siempre `true`. No refleja si la cuenta existe: es una constante para
            que el frontend no interprete el `202` como confirmación de envío.
          example: true
      example:
        detail: >-
          Si el correo corresponde a una cuenta activa, recibirás un mensaje con
          el enlace para restablecer tu clave.
        email_sent: true

    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required:
        - uid
        - token
        - new_password
        - re_new_password
      description: |
        Cuerpo de `POST /api/v1/auth/password-reset-confirm/`. Reúne lo que
        el frontend leyó de la URL del enlace y lo que el usuario escribió.
      properties:
        uid:
          type: string
          format: uuid
          description: |
            Identificador del usuario titular de la cuenta, tomado de los
            parámetros `uid` de la URL del enlace del correo. En este contrato es
            el UUID en texto plano, y no el `uidb64` en base64 que usa el
            endpoint de Django: `TASK-BACK-SEC-02` tiene que elegir si acepta
            ambos o traduce uno a otro en el serializador.

            Un formato inválido produce `400`, no `401`: el cuerpo está mal, el
            token no llegó ni a evaluarse.
          example: c3d4e5f6-2b3c-4d5e-9f70-222222222222
        token:
          type: string
          minLength: 20
          maxLength: 200
          description: |
            Token temporal firmado que llegó en la URL del enlace. El backend
            comprueba la firma, la vigencia de
            `PASSWORD_RESET_TOKEN_LIFETIME` y que no se haya usado antes.

            El valor real lo emite `PasswordResetTokenGenerator` en
            `TASK-BACK-SEC-02`; los límites de longitud de aquí son el orden de
            magnitud esperado y sirven para descartar entradas evidentemente
            malformadas antes de tocar la base de datos.

            No debe registrarse en los logs de acceso: un token de recuperación
            vigente es tan equivalente a la contraseña como la propia clave.
          example: nQv7-Tb4m-Xz9p-Lc2h-Rk8d-3Fj6w-Sy1a-Vu5g
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: |
            Nueva clave en texto plano, que el backend cifra con Bcrypt antes de
            almacenarla. Aplica la misma política que en el registro: al menos
            10 caracteres, una mayúscula, una minúscula y un dígito. El
            incumplimiento produce `400` con `weak_password`.

            No puede ser igual a la clave anterior. Esa comprobación la hace el
            backend comparando contra el hash almacenado, y también devuelve
            `400` con `weak_password`, para no revelar por separado que la clave
            antigua era la correcta.
          example: ClaveNueva2026
        re_new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          writeOnly: true
          description: |
            Repetición de la nueva clave. El backend exige que coincida con
            `new_password` y responde `400` con `password_mismatch` si no, en vez
            de confiar en la comparación del navegador, que el cliente puede
            evitarse.

            Es el campo que verifica `TASK-TEST-SEC-02` con su caso de
            *coincidencia de claves*.
          example: ClaveNueva2026
      example:
        uid: c3d4e5f6-2b3c-4d5e-9f70-222222222222
        token: nQv7-Tb4m-Xz9p-Lc2h-Rk8d-3Fj6w-Sy1a-Vu5g
        new_password: ClaveNueva2026
        re_new_password: ClaveNueva2026

    ProblemTooManyRequests:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
            - retry_after
          properties:
            code:
              type: string
              description: |
                Código de error estable. `too_many_requests` significa que se
                agotó el límite de solicitudes del endpoint. No distingue el
                motivo, porque un `429` específico por correo confirmaría que
                esa cuenta existe.
              example: too_many_requests
            retry_after:
              type: integer
              description: |
                Segundos que faltan para que el límite se restablezca, en el
                mismo valor que la cabecera `Retry-After`. Se incluye en el
                cuerpo para clientes que no leen cabeceras, como un cliente
                móvil en modo BACKGROUND.
              minimum: 1
              example: 900

    ProblemNotFound:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: Código de error estable.
              example: resource_not_found

    ProblemUnauthorized:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: |
                Código de error estable. `unauthorized` cubre el token ausente,
                vencido o con firma inválida.

                En el módulo de autenticación también se usa para los tokens de
                recuperación de contraseña: `invalid_refresh_token` cuando el
                refresh está caducado, revocado o ausente, `refresh_token_reused`
                cuando se detecta la reutilización de uno ya rotado, e
                `invalid_reset_token` cuando el token del enlace de
                restablecimiento es inválido, ya se usó o ha caducado.
              example: unauthorized

    ProblemForbidden:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: |
                Código de error estable. `forbidden` significa que el token es
                válido y el recurso existe, pero el usuario no tiene permiso
                sobre él. No confundir con `404`: el backend no debe revelar la
                existencia de un inmueble ajeno al Agente que lo consulta.
              example: forbidden
            required_roles:
              type: array
              description: |
                Roles que sí habrían tenido permiso. Permite al frontend mostrar
                un mensaje accionable ("solo administradores pueden hacer esto")
                en lugar de un error genérico. Opcional: se omite cuando la
                regla depende del recurso concreto y no de un rol.
              items:
                $ref: '#/components/schemas/UserRole'

    ProblemConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
          properties:
            code:
              type: string
              description: |
                Código de error estable. `property_state_conflict` impide
                suspender un inmueble con visitas confirmadas;
                `schedule_has_bookings` impide desactivar franjas que ya tienen
                citas. El cambio no se aplica parcialmente.

                En el módulo CRM, `appointment_slot_conflict` impide reprogramar
                una cita a un horario ya ocupado por otra cita del mismo agente.
              example: schedule_has_bookings
            errors:
              type: array
              description: |
                Franjas o campos en conflicto. Permite al frontend señalar los
                bloques concretos que deben reasignarse en lugar de mostrar un
                error genérico.
              items:
                type: object
                required:
                  - parameter
                  - message
                properties:
                  parameter:
                    type: string
                    description: Ruta del campo o franja en conflicto.
                    example: days[1].slots[0]
                  message:
                    type: string
                    description: Motivo del conflicto, en español.
                    example: La franja 14:00-18:00 del JUEVES tiene 1 visita confirmada (cita a9c1d2e3).

    ProblemInternalServerError:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - code
            - request_id
          properties:
            code:
              type: string
              description: Código de error estable.
              example: internal_server_error
            request_id:
              type: string
              format: uuid
              description: |
                Identificador de correlación. El cliente debe reportarlo para
                que el equipo pueda rastrear la petición en los logs. No se
                expone detalle interno de la excepción.
