openapi: 3.0.3

info:
  title: HouseBroker Perú - API
  description: |
    Contrato de API REST de HouseBroker Perú (Django REST Framework).

    Este documento es **el contrato acumulado del proyecto**: cada sprint
    incorpora aquí los endpoints que entrega, de modo que al cierre de la
    carrera (Sprint 7) contenga la API completa sin fragmentarse en varios
    archivos.

    ### Contratos incorporados
    | Sprint | Tarea | Alcance |
    |---|---|---|
    | Sprint 1 | `TASK-ARC-PROP-01` | CRUD de propiedades (HU-PROP-01) |
    | Sprint 2 | `TASK-ARC-PROP-02` | Catálogo paginado `GET /api/v1/properties` (HU-PROP-02) |
    | Sprint 2 | `TASK-ARC-PROP-03` | Filtros de búsqueda en `GET /api/v1/properties` (HU-PROP-03) |
    | Sprint 3 | `TASK-ARC-PROP-04` | Estado operativo y horarios de visita (HU-PROP-04) |
    | Sprint 3 | `TASK-ARC-SEC-01` | Registro, inicio de sesión y refresco de token (HU-SEC-01) |
    | Sprint 3 | `TASK-ARC-SEC-02` | Recuperación de contraseña con token temporal (HU-SEC-02) |
    | Sprint 4 | `TASK-ARC-CRM-01` | Disponibilidad por fecha y creación de citas (HU-CRM-01) |
    | Sprint 4 | `TASK-ARC-CRM-02` | Agenda de citas filtrada por rol y estados de cita (HU-CRM-02) |
    | Sprint 4 | `TASK-ARC-PROP-05` | Gestión de propiedades favoritas por usuario (HU-PROP-05) |
    | Sprint 5 | `TASK-ARC-CRM-03` | Ficha e historial consolidado del cliente (HU-CRM-03) |
    | Sprint 5 | `TASK-ARC-CRM-04` | Observaciones y notas de atención del cliente (HU-CRM-04) |

    ### Convenciones
    - Todos los endpoints están bajo el prefijo `/api/v1`.
    - Los parámetros de paginación son opcionales; el servidor aplica
      `DEFAULT_PAGE` y `DEFAULT_LIMIT` cuando se omiten.
    - Los filtros de búsqueda (`minPrice`, `maxPrice`, `propertyType`, `ubigeo`,
      `search`) son opcionales y se combinan con conjunción (AND).
    - Los errores se serializan como `application/problem+json` conforme a
      **RFC 7807 (Problem Details for HTTP APIs)**.
    - Los endpoints mutables exigen `Authorization: Bearer <jwt>` y rol `AGENTE`
      o `ADMINISTRADOR`. Un `401` significa token ausente o inválido; un `403`
      significa token válido sin permiso sobre el recurso.
    - El **access token** viaja en la cabecera `Authorization: Bearer <jwt>` y el
      cliente lo mantiene solo en memoria. El **refresh token** viaja en la
      cookie `HttpOnly` `hb_refresh_token` y nunca en el cuerpo de la respuesta,
      para que no quede expuesto a JavaScript (RF-SEC-01).
    - La recuperación de contraseña usa tokens temporales firmados y de un solo
      uso, entregados por correo. La solicitud responde `202` con un mensaje
      genérico exista o no la cuenta, para no revelar qué correos están
      registrados, y está limitada por `PASSWORD_RESET_THROTTLE`.
    - Los favoritos son una lista privada por usuario: el backend la filtra por
      el `sub` del access token y los endpoints no aceptan ningún parámetro de
      usuario. Agregar y quitar son idempotentes, para que un doble clic o un
      reintento no se traduzcan en un error.
  version: 1.11.0
  contact:
    name: Equipo HouseBroker Perú
    url: https://github.com/brandy-sinche-dev/proyecto-integrador-2-house-broker-peru
  license:
    name: Uso académico
    url: https://github.com/brandy-sinche-dev/proyecto-integrador-2-house-broker-peru/blob/main/README.md

servers:
  - url: http://localhost:8000
    description: Entorno de desarrollo local (Django + DRF)
  - url: https://staging.housebroker.pe
    description: Entorno de staging (verificado contra el SLA de 300 ms)

tags:
  - name: Propiedades
    description: Endpoints para la gestión administrativa y consulta de inmuebles
  - name: Disponibilidad
    description: |
      Estado operativo del inmueble y franjas horarias habilitadas para agendar
      visitas. Solo accesible para Agentes asignados y Administradores.
  - name: Autenticación
    description: |
      Registro de usuarios, inicio de sesión, refresco del access token y
      recuperación de contraseña. El access token se entrega en el cuerpo de la
      respuesta y se envía en la cabecera `Authorization: Bearer`; el refresh
      token se entrega en una cookie `HttpOnly` y no se expone a JavaScript. La
      recuperación usa tokens temporales firmados y de un solo uso, y su
      solicitud está limitada por IP y por correo para frenar el envío masivo
      de correos.
  - name: Favoritos
    description: |
      Propiedades guardadas por el usuario autenticado, para la vista "Mis
      Favoritos" y el botón de corazón del catálogo. La lista es privada y el
      backend la filtra por el usuario del access token; agregar y quitar son
      idempotentes.
  - name: Citas
    description: |
      Disponibilidad de visitas y agenda de citas: consulta de horarios libres
      por fecha, reserva de una visita y gestión de su estado (confirmar,
      reprogramar, cancelar, completar o registrar la inasistencia). La reserva
      y el cambio de estado exigen sesión; solo el Agente asignado o un
      Administrador modifican el estado de una cita.
  - name: Clientes
    description: |
      Ficha, historial y observaciones del cliente para el CRM. Solo accesible
      para Agentes que atienden al menos una cita del cliente y para
      Administradores. El perfil expone datos de contacto, preferencias y
      resumen de actividad; el historial pagina las citas y sus cambios de
      estado como una línea de tiempo; las notas registran el seguimiento
      comercial del agente y solo su autor o un Administrador pueden
      eliminarlas.

security:
  - bearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Autenticación
      security: []
      operationId: registerUser
      summary: Registrar un usuario
      description: |
        Crea una cuenta de cliente (RF-SEC-01). Es el único endpoint del
        contrato que **no** requiere sesión, y por eso su cuerpo está acotado
        para que no permita escaladas de privilegio.

        ### Por qué `role` solo admite `CLIENTE`

        El campo `role` forma parte del cuerpo porque el enunciado de la tarea
        lo pide, pero su enumerado tiene un único valor:

        - Un registro público que aceptara `ADMINISTRADOR` dejaría que
          cualquiera se autopromoviera a administrador con un `curl`.
        - Las cuentas de `AGENTE` y `ADMINISTRADOR` las crea un administrador
          desde el panel, no el propio usuario.

        Enviar `AGENTE` o `ADMINISTRADOR` produce `400` con
        `role_not_assignable`, que es un rechazo explícito y no un campo
        ignorado en silencio.

        ### Contraseña

        `password` viaja en el cuerpo y se almacena con Bcrypt; nunca se
        devuelve en ninguna respuesta. Los criterios mínimos de longitud se
        validan en el servidor y su incumplimiento produce `400` con
        `weak_password`.

        ### Sesión tras el registro

        La respuesta es `201` con el usuario creado y **sin tokens**: el
        registro no inicia sesión. El cliente debe llamar a
        `POST /api/v1/auth/login` a continuación. Entregar aquí el par de
        tokens obligaría al frontend a duplicar la lógica de almacenamiento de
        sesión que ya existe en el login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            examples:
              registro:
                summary: Alta de un cliente
                value:
                  email: maria.quispe@correo.com
                  password: ClaveSegura2026
                  full_name: Maria Fernanda Quispe
                  phone: '+51 987 654 321'
      responses:
        '201':
          description: Usuario registrado exitosamente
          headers:
            Location:
              description: URL del recurso creado.
              schema:
                type: string
                format: uri
              example: http://localhost:8000/api/v1/auth/users/c3d4e5f6-2b3c-4d5e-9f70-222222222222
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
              example:
                id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
                email: maria.quispe@correo.com
                full_name: Maria Fernanda Quispe
                phone: '+51 987 654 321'
                role: CLIENTE
                is_active: true
                created_at: '2026-10-05T09:12:44Z'
        '400':
          description: |
            El cuerpo no supera la validación. Casos cubiertos:
            - `email` con formato inválido.
            - `password` más corta que `PASSWORD_MIN_LENGTH` o demasiado común.
            - `full_name` ausente o de longitud insuficiente.
            - `role` distinto de `CLIENTE` (`role_not_assignable`).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                emailInvalido:
                  summary: Formato de correo incorrecto
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El campo 'email' no tiene un formato de correo válido.
                    instance: /api/v1/auth/register
                    code: invalid_query_parameter
                    errors:
                      - parameter: email
                        message: El valor 'maria.quispe@correo' no es una dirección de correo válida.
                rolNoAsignable:
                  summary: Intento de registro con rol privilegiado
                  value:
                    type: https://housebroker.pe/errors/role-not-assignable
                    title: Rol no asignable en el registro
                    status: 400
                    detail: El registro público solo admite el rol 'CLIENTE'.
                    instance: /api/v1/auth/register
                    code: role_not_assignable
                    errors:
                      - parameter: role
                        message: El valor 'ADMINISTRADOR' no puede asignarse en el registro. Las cuentas de agente y administrador las crea un administrador.
                contrasenaDebil:
                  summary: Contraseña por debajo del mínimo
                  value:
                    type: https://housebroker.pe/errors/weak-password
                    title: Contraseña insegura
                    status: 400
                    detail: El campo 'password' no cumple los requisitos de seguridad.
                    instance: /api/v1/auth/register
                    code: weak_password
                    errors:
                      - parameter: password
                        message: La contraseña debe tener al menos 10 caracteres, una mayúscula, una minúscula y un dígito.
        '409':
          description: |
            El correo ya está registrado. No es un error de formato: el
            `email` es válido, lo que falla es que el recurso ya existe.
            Devolver `400` haría que el formulario mostrara un error de campo
            sin explicar el motivo real.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemConflict'
              example:
                type: https://housebroker.pe/errors/email-already-registered
                title: Correo ya registrado
                status: 409
                detail: Ya existe una cuenta con el correo 'maria.quispe@correo.com'.
                instance: /api/v1/auth/register
                code: email_already_registered
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags:
        - Autenticación
      security: []
      operationId: loginUser
      summary: Iniciar sesión
      description: |
        Valida las credenciales y devuelve un par de tokens (RF-SEC-01).

        ### Dónde acaba cada token

        | Token | Transporte | Por qué |
        |---|---|---|
        | `access` | cuerpo de la respuesta | El cliente lo mantiene en memoria y lo envía en `Authorization: Bearer` |
        | `refresh` | cookie `HttpOnly` `hb_refresh_token` | Invisible a JavaScript, sobrevive recargas y cierra la sesión al expirar |

        El refresh token **no** se incluye en el cuerpo. Exponerlo en la
        respuesta lo haría accesible desde JavaScript, que es justo lo que la
        cookie `HttpOnly` evita, y permitiría que un XSS robara la sesión
        completa.

        ### Mensajes de error

        Un correo inexistente y una contraseña incorrecta producen el **mismo**
        `401` con `invalid_credentials` y el mismo `detail`. Distinguirlos
        confirmaría al atacante qué correos están registrados en la plataforma.

        ### Sesión y CSRF

        El login es el único punto donde se establece la sesión, y por eso es
        el objetivo natural de un forgery: el endpoint debe exigir un token CSRF
        de doble envío además de las credenciales. La respuesta incluye la
        cabecera `Set-Cookie` con la política de la cookie.

        ### Mantenimiento de sesión

        Tras un login exitoso el cliente puede extender la sesión llamando a
        `POST /api/v1/auth/refresh`. No hay `logout` en esta versión del
        contrato: la sesión termina cuando expira el refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: maria.quispe@correo.com
              password: ClaveSegura2026
      responses:
        '200':
          description: Credenciales válidas
          headers:
            Set-Cookie:
              description: |
                Cookie `HttpOnly` con el refresh token y los atributos de
                `securitySchemes.refreshCookie`.
              schema:
                type: string
              example: hb_refresh_token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=604800
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjM2Q0ZTVmNiJ9
                token_type: Bearer
                expires_in: 1800
                user:
                  id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
                  email: maria.quispe@correo.com
                  full_name: Maria Fernanda Quispe
                  phone: '+51 987 654 321'
                  role: CLIENTE
                  is_active: true
                  created_at: '2026-10-05T09:12:44Z'
        '400':
          description: El cuerpo no supera la validación
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              example:
                type: https://housebroker.pe/errors/invalid-query-parameter
                title: Parámetro de consulta inválido
                status: 400
                detail: El cuerpo debe incluir 'email' y 'password'.
                instance: /api/v1/auth/login
                code: invalid_query_parameter
                errors:
                  - parameter: password
                    message: Este campo es obligatorio.
        '401':
          description: |
            Credenciales incorrectas. Cubre indistintamente el correo
            inexistente y la contraseña equivocada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemUnauthorized'
              example:
                type: https://housebroker.pe/errors/invalid-credentials
                title: Credenciales inválidas
                status: 401
                detail: El correo o la contraseña no coinciden con ninguna cuenta activa.
                instance: /api/v1/auth/login
                code: invalid_credentials
        '403':
          description: |
            Las credenciales son correctas pero la cuenta no puede iniciar
            sesión, por estar desactivada (`is_active = false`).

            Se distingue del `401` a propósito: un `401` haría que el cliente
            creyera que su contraseña falla y la volviera a enviar.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              example:
                type: https://housebroker.pe/errors/account-disabled
                title: Cuenta desactivada
                status: 403
                detail: La cuenta esta desactivada. Contacta al administrador para reactivarla.
                instance: /api/v1/auth/login
                code: account_disabled
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      tags:
        - Autenticación
      operationId: refreshAccessToken
      summary: Renovar el access token
      security:
        - refreshCookie: []
      description: |
        Emite un access token nuevo a partir del refresh token de la cookie
        `hb_refresh_token`. No lleva cuerpo: la credencial viaja en la cookie que
        el navegador adjunta solo.

        ### Rotación del refresh token

        Cada refresco **rota** el refresh token: la respuesta emite un `access`
        nuevo y un `refresh` nuevo, y el anterior queda invalidado.

        | Situación | Resultado |
        |---|---|
        | Se refresca con el token vigente | `200`, `access` nuevo y `refresh` rotado |
        | Se refresca con un token ya rotado | `401` `refresh_token_reused` |
        | Se refresca con un token expirado o revocado | `401` `invalid_refresh_token` |

        Detectar la reutilización es lo que hace útil la rotación: si un token
        robado se usa desde otro equipo, el uso legítimo posterior falla y
        queda registrado, en lugar de que ambos sigan funcionando en paralelo.
        Tras detectar un reuso se invalida toda la familia de tokens del
        usuario, de modo que el atacante y el titular pierden la sesión.

        No lleva token CSRF explícito porque la cookie es `SameSite=Strict`: el
        navegador no la adjunta en un envío originado en otro sitio, que es
        justamente el escenario de CSRF. Si `SameSite` se relajara, este
        endpoint pasaría a exigirlo.
      responses:
        '200':
          description: Access token renovado
          headers:
            Set-Cookie:
              description: |
                Cookie `HttpOnly` con el refresh token rotado, que reemplaza a
                la anterior.
              schema:
                type: string
              example: hb_refresh_token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=604800
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjM2Q0ZTVmNiJ9
                token_type: Bearer
                expires_in: 1800
                user:
                  id: c3d4e5f6-2b3c-4d5e-9f70-222222222222
                  email: maria.quispe@correo.com
                  full_name: Maria Fernanda Quispe
                  phone: '+51 987 654 321'
                  role: CLIENTE
                  is_active: true
                  created_at: '2026-10-05T09:12:44Z'
        '401':
          description: |
            El refresh token no es válido: falta la cookie, está expirado, fue
            revocado o ya se rotó. La sesión debe rehacerse con
            `POST /api/v1/auth/login`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: |
                Cookie `hb_refresh_token` vacía, que borra la sesión en el
                navegador cuando el token no es recuperable.
              schema:
                type: string
              example: hb_refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemUnauthorized'
              examples:
                tokenInvalido:
                  summary: Cookie ausente, expirada o revocada
                  value:
                    type: https://housebroker.pe/errors/invalid-refresh-token
                    title: Refresh token inválido
                    status: 401
                    detail: El refresh token no es válido. Vuelve a iniciar sesión.
                    instance: /api/v1/auth/refresh
                    code: invalid_refresh_token
                tokenReutilizado:
                  summary: Se reutilizó un token ya rotado
                  value:
                    type: https://housebroker.pe/errors/refresh-token-reused
                    title: Refresh token reutilizado
                    status: 401
                    detail: El refresh token ya fue rotado. Por seguridad se cerraron todas las sesiones del usuario.
                    instance: /api/v1/auth/refresh
                    code: refresh_token_reused
        '403':
          description: |
            El token era válido pero la cuenta fue desactivada después de
            emitirse. La sesión se cierra igualmente.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemForbidden'
              example:
                type: https://housebroker.pe/errors/account-disabled
                title: Cuenta desactivada
                status: 403
                detail: La cuenta esta desactivada. Contacta al administrador para reactivarla.
                instance: /api/v1/auth/refresh
                code: account_disabled
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/password-reset/:
    post:
      tags:
        - Autenticación
      security: []
      operationId: requestPasswordReset
      summary: Solicitar el restablecimiento de la clave
      description: |
        Pide el envío de un correo con un enlace de restablecimiento (RF-SEC-02).

        ### Una única respuesta, exista o no la cuenta

        El endpoint responde `202` **siempre**, con el mismo cuerpo, esté el
        correo registrado o no. Un `404` o un `email_sent: false` confirmarían
        al atacante qué correos están dados de alta, que es información
        reutilizable para fuerza bruta o spam. Es el mismo criterio que ya aplica
        a `login`, donde un correo inexistente y una clave incorrecta comparten
        `invalid_credentials`.

        El envío ocurre en segundo plano, por eso `202 Accepted` y no `200`: la
        petición queda encolada y el usuario no debe esperar al servidor SMTP.

        ### El token del enlace

        El enlace del correo lleva `uid` y `token` en la URL
        (`/recuperar-clave?uid=...&token=...`), que el frontend reenvía en el
        cuerpo de `password-reset-confirm`. El token es **firmado y de un solo
        uso**, y caduca a los `PASSWORD_RESET_TOKEN_LIFETIME` minutos.

        ### Límite de solicitudes

        Es el endpoint más expuesto a abuso del sistema, porque cada petición
        aceptada dispara un correo. Se aplican dos límites, por IP y por correo,
        y ambos devuelven `429` con la cabecera `Retry-After`. El límite por
        correo es además el que frena el spam dirigido a una víctima
        concreta. La implementación corresponde a `TASK-WPO-SEC-02`.

        ### Cuentas inactivas

        Una cuenta desactivada recibe el mismo `202` que una activa. Informar por
        correo que la cuenta está desactivada se lo diría al remitente de la
        solicitud, que puede no ser el titular.

        ```bash
        curl -i -X POST http://localhost:8000/api/v1/auth/password-reset/ \
          -H "Content-Type: application/json" \
          -d '{"email":"maria.quispe@correo.com"}'
        # -> 202 {"detail":"Si el correo corresponde a una cuenta activa, ...","email_sent":true}
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: maria.quispe@correo.com
      responses:
        '202':
          description: |
            Solicitud aceptada. El cuerpo es idéntico exista o no la cuenta.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
              example:
                detail: >-
                  Si el correo corresponde a una cuenta activa, recibirás un
                  mensaje con el enlace para restablecer tu clave.
                email_sent: true
        '400':
          description: El correo no supera la validación de formato
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              example:
                type: https://housebroker.pe/errors/invalid-query-parameter
                title: Parámetro de consulta inválido
                status: 400
                detail: El cuerpo debe incluir un 'email' válido.
                instance: /api/v1/auth/password-reset/
                code: invalid_query_parameter
                errors:
                  - parameter: email
                    message: Introduce un correo electrónico válido.
        '429':
          description: |
            Se superó el límite de solicitudes, por IP o por correo. La
            cabecera `Retry-After` indica los segundos que deben pasar antes de
            reintentar.
          headers:
            Retry-After:
              description: |
                Segundos que faltan para que el límite se restablezca. El
                cliente no debe reintentar antes de ese plazo.
              schema:
                type: integer
                format: int32
                minimum: 1
              example: 900
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemTooManyRequests'
              examples:
                limitePorIp:
                  summary: Se superó el límite por dirección IP
                  value:
                    type: https://housebroker.pe/errors/too-many-requests
                    title: Demasiadas solicitudes
                    status: 429
                    detail: Superaste el límite de solicitudes desde esta IP. Reintenta en 15 minutos.
                    instance: /api/v1/auth/password-reset/
                    code: too_many_requests
                    retry_after: 900
                limitePorCorreo:
                  summary: Se superó el límite para ese correo
                  value:
                    type: https://housebroker.pe/errors/too-many-requests
                    title: Demasiadas solicitudes
                    status: 429
                    detail: Ya se enviaron varios correos a esta dirección. Reintenta en 15 minutos.
                    instance: /api/v1/auth/password-reset/
                    code: too_many_requests
                    retry_after: 900
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/password-reset-confirm/:
    post:
      tags:
        - Autenticación
      security: []
      operationId: confirmPasswordReset
      summary: Confirmar el restablecimiento con una nueva clave
      description: |
        Valida el token temporal recibido por correo y guarda la nueva clave
        (RF-SEC-02). Cierra el flujo abierto por `password-reset`.

        ### ¿Por qué `uid` y `token` van en el cuerpo

        El enlace del correo los trae en la URL, pero el frontend los reenvía en
        el cuerpo del `POST`, que es lo que espera el endpoint de Django. La
        alternativa sería un token único que ya incluyera el `uid`, y es más
        limpia, pero obliga a apartarse de `PasswordResetTokenGenerator`, que es
        lo que fija `TASK-BACK-SEC-02`.

        ### La respuesta es `204`

        No devuelve tokens ni datos del usuario: **el reset no inicia sesión**.
        Tras restablecer la clave el cliente debe llamar a `login`, así el
        frontend tiene un solo camino para obtener un access token y no dos
        rutas que mantener sincronizadas.

        ### Se cierran todas las sesiones

        Al guardar la nueva clave el backend **revoca todas las familias de
        refresh token** del usuario e invalida los tokens de recuperación
        pendientes. Es el motivo de ser del flujo: si la clave se cambió porque
        la anterior estaba comprometida, dejar las sesiones abiertas haría
        inútil el arreglo, porque un atacante con un refresh token robado
        seguiría entrando con la nueva clave.

        La respuesta devuelve `Set-Cookie` con `Max-Age=0` para borrar la cookie
        `hb_refresh_token` del navegador, que ya no corresponde a una sesión
        válida.

        ### Un token, un uso

        | Token recibido | Resultado |
        |---|---|
        | Válido y vigente | `204`, nueva clave guardada |
        | Ya usado antes | `401` `invalid_reset_token` |
        | Caducado | `401` `invalid_reset_token` |
        | Firmado con otra clave | `401` `invalid_reset_token` |

        Los tres casos de `401` comparten el mismo `detail` a propósito:
        distinguirlos ayudaría a un atacante a medir la antigüedad del
        enlace. El frontend solo necesita saber que debe pedir un correo nuevo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
            example:
              uid: c3d4e5f6-2b3c-4d5e-9f70-222222222222
              token: nQv7-Tb4m-Xz9p-Lc2h-Rk8d-3Fj6w-Sy1a-Vu5g
              new_password: ClaveNueva2026
              re_new_password: ClaveNueva2026
      responses:
        '204':
          description: |
            Clave restablecida. No hay cuerpo; todas las sesiones del usuario
            han sido revocadas.
          headers:
            Set-Cookie:
              description: |
                Cookie `hb_refresh_token` con `Max-Age=0`, que borra la sesión
                del navegador. El `HttpOnly` y el `Secure` se mantienen.
              schema:
                type: string
              example: hb_refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          description: |
            El cuerpo no supera la validación. Cubre el `uid` con formato
            inválido, la nueva clave débil y la falta de coincidencia entre las
            dos claves.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              examples:
                uidInvalido:
                  summary: El `uid` no tiene el formato de un UUID
                  value:
                    type: https://housebroker.pe/errors/invalid-query-parameter
                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El cuerpo debe incluir un 'uid' válido.
                    instance: /api/v1/auth/password-reset-confirm/
                    code: invalid_query_parameter
                    errors:
                      - parameter: uid
                        message: El identificador de usuario no tiene un formato válido.
                claveDebil:
                  summary: La nueva clave no cumple la política de seguridad
                  value:
                    type: https://housebroker.pe/errors/weak-password
                    title: Contraseña débil
                    status: 400
                    detail: La nueva clave no cumple los requisitos de seguridad.
                    instance: /api/v1/auth/password-reset-confirm/
                    code: weak_password
                    errors:
                      - parameter: new_password
                        message: La clave debe tener al menos 10 caracteres, una mayúscula, una minúscula y un dígito.
                clavesDistintas:
                  summary: Las dos claves no coinciden
                  value:
                    type: https://housebroker.pe/errors/password-mismatch
                    title: Las claves no coinciden
                    status: 400
                    detail: "Los campos 'new_password' y 're_new_password' deben ser iguales."
                    instance: /api/v1/auth/password-reset-confirm/
                    code: password_mismatch
                    errors:
                      - parameter: re_new_password
                        message: Las claves no coinciden.
        '401':
          description: |
            El token de recuperación es inválido, ya se usó o ha caducado.
            Los tres casos comparten `detail` para no filtrar información al
            atacante.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemUnauthorized'
              example:
                type: https://housebroker.pe/errors/invalid-reset-token
                title: Enlace de recuperación inválido
                status: 401
                detail: El enlace ya no es válido. Solicita un correo nuevo para restablecer tu clave.
                instance: /api/v1/auth/password-reset-confirm/
                code: invalid_reset_token
        '500':
          $ref: '#/components/responses/InternalServerError'

