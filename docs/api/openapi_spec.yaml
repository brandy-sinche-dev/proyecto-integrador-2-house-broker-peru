                    title: Parámetro de consulta inválido
                    status: 400
                    detail: El parámetro 'date' debe tener formato ISO 8601 (YYYY-MM-DD).
                    instance: /api/v1/properties/b2c1f5a0-1a2b-4c3d-9e0f-111111111111/available-slots?date=08-10-2026
                    code: invalid_query_parameter
                    errors:
                      - parameter: date
                        message: El valor '08-10-2026' no cumple el formato YYYY-MM-DD.
                fechaPasada:
