        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/clients/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags:
        - Clientes
      operationId: listClientNotes
      summary: Consultar las observaciones de atención de un cliente
      description: |
        Devuelve la lista cronológica de observaciones de atención registradas
        por los agentes sobre el cliente (RF-CRM-04). Es información interna de
        seguimiento comercial: un `CLIENTE` no puede leerla.

        ### Orden y paginación

        Las notas se ordenan por `created_at` descendente, con desempate por
        `id` descendente. El desempate mantiene la paginación estable cuando dos
        notas comparten timestamp, igual que en el historial del cliente. Se
        reutilizan `page` y `limit` del catálogo; los enlaces `next` y
        `previous` conservan la paginación de la consulta.

        ### Alcance según el rol

        | Rol | Acceso |
        |---|---|
        | `AGENTE` | Solo clientes con al menos una cita asignada a su cuenta |
        | `ADMINISTRADOR` | Cualquier cliente |
        | `CLIENTE` | Sin acceso a las notas internas |

        Un identificador inexistente, un usuario que no es `CLIENTE` o un
        cliente sin citas con el agente autenticado responden
        `404 resource_not_found`, para no revelar la existencia de cuentas
