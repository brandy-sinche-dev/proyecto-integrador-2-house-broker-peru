    post:
      tags:
        - Clientes
      operationId: createClientNote
      summary: Registrar una observación de atención
      description: |
        Registra una nota u observación de seguimiento comercial sobre el
        cliente (RF-CRM-04). El autor se toma del `sub` del access token y
        **nunca** del cuerpo, para que un agente no pueda atribuir una nota a
        otra persona.

        La nota puede asociarse opcionalmente a una cita (`appointment_id`), pero
        también admite notas de seguimiento sin visita previa, como una llamada
        telefónica. Los campos de resultado de la visita (`interest_level`,
        `client_showed_up`, `counteroffer_*`, `followup_at`) son opcionales; una
        nota puede ser solo texto.

        ### Reglas de validación

        | Regla | Código | Respuesta |
        |---|---|---|
        | `body` ausente o vacío | `invalid_query_parameter` | `400` |
        | `body` de más de 2000 caracteres | `invalid_query_parameter` | `400` |
        | `interest_level` fuera de 1–5 | `invalid_query_parameter` | `400` |
        | `counteroffer_amount` sin moneda, o moneda sin monto | `invalid_counteroffer` | `400` |
        | `appointment_id` inexistente o de otro cliente | `invalid_appointment_reference` | `400` |

        Los campos de escritura no se aceptan fuera de `ClientNoteCreateInput`:
        el esquema declara `additionalProperties: false`, así que `author`,
        `client_id` o `created_at` en el cuerpo producen `400` en lugar de
        ignorarse en silencio.

        ### Alcance según el rol

        Aplica la misma regla que la ficha: un `AGENTE` solo registra notas sobre
        clientes con citas asignadas a su cuenta, un `ADMINISTRADOR` sobre
        cualquiera y un `CLIENTE` recibe `403`. Un cliente invisible responde
        `404 resource_not_found`.
      parameters:
        - $ref: '#/components/parameters/XRequestIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientNoteCreateInput'
            example:
              body: >-
                El cliente mostró interés en la vista al mar y pidió evaluar
                una contraoferta.
              appointment_id: a9c1d2e3-4f5a-4b6c-8d7e-9f0a1b2c3d4e
              interest_level: 4
              client_showed_up: true
              counteroffer_amount: 2350.0
              counteroffer_currency: PEN
              followup_at: '2026-10-12T15:00:00Z'
      responses:
        '201':
          description: Observación registrada exitosamente
          headers:
            Location:
              description: URL absoluta del recurso creado.
              schema:
                type: string
                format: uri
              example: http://localhost:8000/api/v1/clients/c3d4e5f6-2b3c-4d5e-9f70-222222222222/notes/5e6f7081-4d5e-6f70-9a01-444444444444
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
