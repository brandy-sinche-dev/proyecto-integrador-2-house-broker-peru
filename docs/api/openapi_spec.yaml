    post:
      tags:
        - Favoritos
      operationId: addFavorite
      summary: Guardar una propiedad en favoritos
      description: |
        Añade un inmueble a la lista del usuario autenticado.

        ### Idempotente a propósito

        Devuelve `200` con el favorito tanto si lo acaba de añadir como si ya
        estaba, y en ambos casos devuelve el mismo `added_at` original. No hay
        `201` ni un `409` por duplicado, a propósito.

        El motivo es `TASK-WPO-PROP-05`, que implementa el botón con debounce:
        un doble clic o un reintento por red llega al servidor dos veces, y si la
        segunda devolviera un error el frontend tendría que distinguir entre
        "ya estaba" y "falló de verdad". Con `200` siempre, el cliente solo
        tiene un camino único y el `added_at` original evita que el orden de la
        lista cambie por un reintento.

        ### El `404` es del inmueble, no de la lista

        El `404 resource_not_found` aparece cuando el `property_id` no
        corresponde a ningún inmueble existente, o cuando existe pero está
        desactivado (`is_active: false`), que es la eliminación lógica del
        proyecto. Guardar un inmueble que ya no está en el catálogo no tiene
        sentido.

        No devuelve tokens ni datos de sesión: los favorites no cambian la
        autenticación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteInput'
            example:
              property_id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
      responses:
        '200':
          description: |
            Inmueble guardado. La misma respuesta si ya estaba en la lista, con
            el `added_at` de la primera vez.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
              example:
                property:
                  id: b2c1f5a0-1a2b-4c3d-9e0f-111111111111
                  title: Departamento amoblado en Miraflores
                  price: 150000.0
                  moneda: PEN
                  mode: VENTA
                  address: Av. Larco 456, Miraflores
                  property_type: DEPARTAMENTO
                  is_active: true
                  is_favorite: true
                  created_at: '2026-09-07T10:00:00Z'
                added_at: '2026-10-05T09:12:44Z'
        '400':
          description: El `property_id` no tiene el formato de un UUID
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemBadRequest'
              example:
                type: https://housebroker.pe/errors/invalid-query-parameter
                title: Parámetro de consulta inválido
                status: 400
                detail: El cuerpo debe incluir un 'property_id' válido.
                instance: /api/v1/favorites/
                code: invalid_query_parameter
                errors:
                  - parameter: property_id
                    message: El identificador de propiedad no tiene un formato válido.
        '401':
          description: Token ausente, vencido o con firma inválida
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemUnauthorized'
              example:
                type: https://housebroker.pe/errors/unauthorized
                title: No autenticado
                status: 401
                detail: El token de acceso es inválido o ha expirado.
                instance: /api/v1/favorites/
                code: unauthorized
        '404':
          description: |
            El inmueble no existe o está desactivado. No se confunde con "ya
            estaba en favoritos": eso devuelve `200`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
